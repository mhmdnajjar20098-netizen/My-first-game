<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Void Runner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Tajawal:wght@500;700&display=swap">
<style>
/* Layout: full-bleed canvas stage. Menus are centered glass panels over the live starfield. HUD is drawn on the canvas; pause and boost buttons float in the corners. */
:root{
  --bg:#04050c; --ink:#e8edff; --dim:#8f9bc7; --line:#2b3562;
  --panel:rgba(10,14,30,.92); --panel-hi:rgba(28,36,70,.95);
  --accent:#ffb02e; --accent-ink:#1a1204; --info:#52c8ff; --good:#4ee6a0; --bad:#ff5a6e; --gem:#c79bff;
  --display:'Chakra Petch','Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[dir=rtl] *{letter-spacing:0!important}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,rgba(4,5,12,.28),rgba(4,5,12,.84));animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel{width:min(100%,440px);max-height:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.logo{font-weight:700;font-size:clamp(32px,10.5vw,50px);letter-spacing:.14em;line-height:1.05;text-transform:uppercase;text-align:center;background:linear-gradient(180deg,#fff 18%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding-block:4px}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.04em}
.tag{margin:0;text-align:center;color:var(--dim)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wallet{display:flex;gap:16px;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.head .wallet{justify-content:flex-end;gap:12px}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb02e 60%,#b8741a);vertical-align:-1px;margin-inline-end:6px}
.gem{display:inline-block;width:9px;height:9px;background:linear-gradient(135deg,#ecd8ff,#a56bff);transform:rotate(45deg);margin-inline:3px 8px}
.btn{font:700 16px var(--display);border:1px solid var(--line);background:var(--panel-hi);color:var(--ink);padding:12px 16px;border-radius:6px;cursor:pointer;min-height:48px;text-align:center;transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--dim)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.tab:focus-visible,.lv:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.sub{color:var(--dim);font-size:13px}
.langchip{position:absolute;top:12px;inset-inline-end:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.lv{position:relative;font:700 16px var(--display);height:48px;border-radius:6px;border:1px solid var(--line);background:var(--panel-hi);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.lv.boss{border-color:var(--bad);color:#ffc2cb}
.lv.boss::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;background:var(--bad);transform:rotate(45deg)}
.lv.done::before{content:"";position:absolute;bottom:4px;left:50%;width:14px;margin-left:-7px;height:2px;background:var(--info)}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lv[disabled]{opacity:.32;cursor:not-allowed}
.tabs{display:flex;gap:6px}
.tab{flex:1;font:700 14px var(--display);padding:10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--panel-hi);color:var(--ink);border-color:var(--dim)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row b{font-size:16px}
.row .sub{grid-column:1}
.pips{display:flex;gap:3px;grid-column:1;margin-top:2px}
.pip{flex:1;height:5px;border-radius:2px;background:#222b52;max-width:26px}
.pip.on{background:var(--accent)}
.row .btn{grid-column:2;grid-row:1/4;min-width:96px}
.row.set{grid-template-columns:minmax(0,1fr) auto}
.row.set .btn{grid-row:auto;min-width:92px}
input[type=range]{width:130px;accent-color:var(--accent)}
#prevWrap{display:flex;justify-content:center;background:linear-gradient(180deg,#070a1c,#10183a);border:1px solid var(--line);border-radius:8px;padding:6px}
#prev{width:100%;max-width:240px;height:auto;aspect-ratio:240/140;display:block}
.stat{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:#222b52;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
#pauseBtn{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:rgba(10,14,30,.7);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:0}
#pauseBtn i{display:block;width:4px;height:16px;background:var(--ink);border-radius:1px}
#boostBtn{--p:100%;position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;touch-action:none;color:var(--ink);font:700 13px var(--display);letter-spacing:.1em;background:conic-gradient(var(--accent) var(--p),#232c55 0);display:flex;align-items:center;justify-content:center;padding:0}
#boostBtn span{display:flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:50%;background:#0c1126}
#boostBtn.on span{background:#3a2a0c;color:#ffd48a}
.adbar{height:10px;border-radius:5px;background:#222b52;overflow:hidden}
.adbar i{display:block;height:100%;width:0;background:var(--info)}

<div id="stage">

    <section class="screen" id="s-pause" hidden>
      <div class="panel">
        <h2 data-i="paused"></h2>
        <button class="btn primary" id="p-resume" data-i="resume"></button>
        <button class="btn" id="p-restart" data-i="restart"></button>
        <button class="btn" id="p-set" data-i="settings"></button>
        <button class="btn" id="p-menu" data-i="menu"></button>
      </div>
    </section>

    <section class="screen" id="s-revive" hidden>
      <div class="panel">
        <h2 data-i="destroyed"></h2>
        <div class="sub" id="rv-info"></div>
        <button class="btn primary" id="rv-ad"></button>
        <button class="btn" id="rv-coin"></button>
        <button class="btn" id="rv-quit" data-i="giveUp"></button>
      </div>
    </section>

    <section class="screen" id="s-ad" hidden>
      <div class="panel">
        <h2 data-i="adTitle"></h2>
        <div class="sub" id="ad-sub"></div>
        <div class="adbar"><i id="ad-fill"></i></div>
      </div>
    </section>

    <section class="screen" id="s-lost" hidden>
      <div class="panel">
        <h2 data-i="destroyed"></h2>
        <div id="lostStats"></div>
        <button class="btn primary" id="l-retry" data-i="retry"></button>
        <button class="btn" id="l-shop" data-i="shop"></button>
        <button class="btn" id="l-menu" data-i="menu"></button>
      </div>
    </section>

    <section class="screen" id="s-done" hidden>
      <div class="panel">
        <h2 id="d-title"></h2>
        <div id="doneStats"></div>
        <button class="btn primary" id="d-next" data-i="next"></button>
        <button class="btn" id="d-shop" data-i="shop"></button>
        <button class="btn" id="d-menu" data-i="menu"></button>
      </div>
    </section>

    <section class="screen" id="s-over" hidden>
      <div class="panel">
        <div class="logo" data-i="victory"></div>
        <p class="tag" data-i="victoryText"></p>
        <div id="overStats"></div>
        <button class="btn primary" id="o-shop" data-i="shop"></button>
        <button class="btn" id="o-menu" data-i="menu"></button>
      </div>
    </section>
  </div>
</div>

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;

/* ============ save ============ */
const KEY='voidrunner.v1';
function defaults(){return{coins:0,gems:0,unlocked:1,cleared:{},up:{},prem:{coins2:false,skins:['default'],skin:'default'},set:{sfx:true,vol:.7,vib:true,shake:true,lang:'en'}};}
function loadSave(){
  const d=defaults();let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(s&&typeof s==='object'){
    d.coins=+s.coins||0;d.gems=+s.gems||0;d.unlocked=clamp(+s.unlocked||1,1,100);
    if(s.cleared)d.cleared=s.cleared;if(s.up)d.up=s.up;
    if(s.prem){d.prem.coins2=!!s.prem.coins2;if(Array.isArray(s.prem.skins))d.prem.skins=s.prem.skins;d.prem.skin=s.prem.skin||'default';}
    if(s.set)Object.assign(d.set,s.set);
  }
  return d;
}
let save=loadSave();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}

}};
function t(k,v){
  let s=(T[save.set.lang]&&T[save.set.lang][k]);if(s===undefined)s=T.en[k];if(s===undefined)s=k;
  if(v)for(const key in v)s=String(s).replace('{'+key+'}',v[key]);
  return s;
}
const bossName=b=>(T[save.set.lang]||T.en).bossNames[b-1]||'';

/* ============ audio (effects only, no music) ============ */
const AU={c:null,g:null,nb:null,last:{}};
function audioInit(){
  try{
    if(!AU.c){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      AU.c=new C();AU.g=AU.c.createGain();AU.g.connect(AU.c.destination);
      const len=AU.c.sampleRate;AU.nb=AU.c.createBuffer(1,len,AU.c.sampleRate);
      const d=AU.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }
    if(AU.c.state==='suspended')AU.c.resume();
    AU.g.gain.value=save.set.vol;
  }catch(e){}
}
function tone(f1,f2,dur,type,vol,delay){
  const c=AU.c,t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(AU.g);o.start(t0);o.stop(t0+dur+.03);
}
function noise(dur,vol,f1,f2,ftype,delay){
  const c=AU.c,t0=c.currentTime+(delay||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.nb;f.type=ftype||'lowpass';f.frequency.setValueAtTime(f1,t0);f.frequency.exponentialRampToValueAtTime(Math.max(40,f2),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(AU.g);s.start(t0,Math.random()*.5);s.stop(t0+dur+.03);
}

/* ============ colour + sprite helpers ============ */
function hsl2hex(h,s,l){
  s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const x=v=>Math.round(255*v).toString(16).padStart(2,'0');
  return '#'+x(f(0))+x(f(8))+x(f(4));
}
const glowC={};
function glow(col){
  if(glowC[col])return glowC[col];
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const n=parseInt(col.slice(1),16),r=n>>16,gg=(n>>8)&255,b=n&255;
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,`rgba(${r},${gg},${b},1)`);gr.addColorStop(.3,`rgba(${r},${gg},${b},.55)`);gr.addColorStop(1,`rgba(${r},${gg},${b},0)`);
  g.fillStyle=gr;g.fillRect(0,0,64,64);
  return glowC[col]=c;
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect){c.roundRect(x,y,w,h,r);}else{c.rect(x,y,w,h);}}
function poly(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath();}

const HUES=[212,168,282,18,334,48,190,2,262,126];
const wHue=w=>HUES[w%10];
function makeNebula(w){
  const c=document.createElement('canvas');c.width=400;c.height=1200;const g=c.getContext('2d'),rn=mulberry(w*977+13),h=wHue(w);
  g.fillStyle=hsl2hex(h,60,5);g.fillRect(0,0,400,1200);
  for(let i=0;i<14;i++){
    const x=rn()*400,y=rn()*1200,r=120+rn()*220,hh=h+(rn()-.5)*70,a=.07+rn()*.1;
    for(const oy of[-1200,0,1200]){
      const gr=g.createRadialGradient(x,y+oy,0,x,y+oy,r);
      gr.addColorStop(0,`hsla(${hh},70%,45%,${a})`);gr.addColorStop(1,`hsla(${hh},70%,30%,0)`);
      g.fillStyle=gr;g.fillRect(0,y+oy-r,400,r*2);
    }
  }
  return c;
}
const planetCache={};
function makePlanet(h,size,ring,seed){
  const rn=mulberry(seed),pad=ring?size*.85:size*.12,S=Math.round(size+pad*2),c=document.createElement('canvas');
  c.width=c.height=S;const g=c.getContext('2d'),cx=S/2,cy=S/2,r=size/2;
  if(ring){
    g.save();g.translate(cx,cy);g.rotate(-.38);
    for(let i=0;i<5;i++){g.strokeStyle=`hsla(${h+i*8},40%,${60-i*5}%,${.5-i*.07})`;g.lineWidth=size*.05;g.beginPath();g.ellipse(0,0,r*(1.35+i*.1),r*(.34+i*.026),0,Math.PI,TAU);g.stroke();}
    g.restore();
  }
  const at=g.createRadialGradient(cx,cy,r*.92,cx,cy,r*1.22);
  at.addColorStop(0,`hsla(${h},80%,65%,.35)`);at.addColorStop(1,`hsla(${h},80%,65%,0)`);
  g.fillStyle=at;g.beginPath();g.arc(cx,cy,r*1.22,0,TAU);g.fill();
  g.save();g.beginPath();g.arc(cx,cy,r,0,TAU);g.clip();
  const bs=g.createLinearGradient(0,cy-r,0,cy+r);bs.addColorStop(0,`hsl(${h},50%,58%)`);bs.addColorStop(1,`hsl(${h+20},55%,30%)`);
  g.fillStyle=bs;g.fillRect(cx-r,cy-r,size,size);
  for(let i=0;i<9;i++){
    g.fillStyle=`hsla(${h+(rn()-.5)*60},${40+rn()*30}%,${35+rn()*35}%,${.1+rn()*.2})`;
    const y=cy-r+rn()*size,hh=size*(.04+rn()*.1);g.fillRect(cx-r,y,size,hh);
  }
  const sh=g.createRadialGradient(cx-r*.4,cy-r*.45,r*.1,cx-r*.1,cy-r*.1,r*1.25);
  sh.addColorStop(0,'rgba(255,255,255,.22)');sh.addColorStop(.5,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,12,.82)');
  g.fillStyle=sh;g.fillRect(cx-r,cy-r,size,size);g.restore();
  if(ring){
    g.save();g.translate(cx,cy);g.rotate(-.38);
    for(let i=0;i<5;i++){g.strokeStyle=`hsla(${h+i*8},40%,${60-i*5}%,${.55-i*.07})`;g.lineWidth=size*.05;g.beginPath();g.ellipse(0,0,r*(1.35+i*.1),r*(.34+i*.026),0,0,Math.PI);g.stroke();}
    g.restore();
  }
  return c;
}
function planetSprite(w,i){
  const k=w+'-'+i;if(planetCache[k])return planetCache[k];
  const rn=mulberry(w*131+i*17+5);
  return planetCache[k]=makePlanet(wHue(w)+(rn()-.5)*50,110+rn()*140,rn()>.55,w*50+i);
}
const meteorSprites={};
function meteorSet(w){
  if(meteorSprites[w])return meteorSprites[w];
  const out=[],h=wHue(w);
  for(let k=0;k<8;k++){
    const rn=mulberry(k*53+w*7+3),c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');
    const n=11,pts=[];for(let i=0;i<n;i++){const a=i/n*TAU,r=34+rn()*10;pts.push([48+Math.cos(a)*r,48+Math.sin(a)*r]);}
    g.save();g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.clip();
    const gr=g.createRadialGradient(34,32,4,48,48,52);gr.addColorStop(0,`hsl(${h},14%,58%)`);gr.addColorStop(.55,`hsl(${h},12%,30%)`);gr.addColorStop(1,`hsl(${h},16%,11%)`);
    g.fillStyle=gr;g.fillRect(0,0,96,96);
    for(let i=0;i<60;i++){g.fillStyle=`rgba(${rn()>.5?255:0},${rn()>.5?255:0},${rn()>.5?255:0},${.03+rn()*.05})`;g.fillRect(rn()*96,rn()*96,1+rn()*3,1+rn()*3);}
    for(let i=0;i<5;i++){
      const x=22+rn()*52,y=22+rn()*52,r=4+rn()*8;
      g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(x,y,r,r*.8,0,0,TAU);g.fill();
      g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=1.4;g.beginPath();g.ellipse(x-.8,y-.8,r,r*.8,0,Math.PI*.9,Math.PI*1.9);g.stroke();
    }
    g.restore();
    g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=1.5;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.stroke();

}

const stage=$('#stage'),cv=$('#c'),ctx=cv.getContext('2d');
let W=400,H=720,scale=1,offX=0,offY=0,dpr=1,cssW=1,cssH=1;
let world=0,stars=[],planets=[],nebula=null,nebY=0,scrollMul=1;
function resize(){
  const r=stage.getBoundingClientRect();cssW=Math.max(1,r.width);cssH=Math.max(1,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  H=clamp(cssH/cssW*W,600,880);scale=Math.min(cssW/W,cssH/H);offX=(cssW-W*scale)/2;offY=(cssH-H*scale)/2;
  initBackground();
  if(player)player.y=clamp(player.y,H*.28,H-48);
}
function initBackground(){
  stars=[];
  [[70,.7,26],[45,1.1,70],[24,1.7,150]].forEach(([n,sz,sp],li)=>{for(let i=0;i<n;i++)stars.push({x:rnd(0,W),y:rnd(0,H),sz:sz*rnd(.6,1.2),sp:sp*rnd(.85,1.15),tw:rnd(0,TAU),ts:rnd(1,3),l:li});});
  setWorld(world);
}
function newPlanet(init,i){
  const spr=planetSprite(world,rint(0,5));
  const sz=spr.width*rnd(.8,1.15);
  return{spr,sz,x:rnd(0,W),y:init?rnd(-sz,H):-sz*.6-rnd(0,200),sp:rnd(7,16)};
}
function setWorld(w){
  world=w;nebula=makeNebula(w);planets=[];
  for(let i=0;i<3;i++)planets.push(newPlanet(true,i));
}
function updateBackground(dt){
  const target=state==='play'?(player&&player.boost?2.5:1):.55;
  scrollMul=lerp(scrollMul,target,Math.min(1,dt*3));
  nebY=(nebY+14*scrollMul*dt)%1200;
  for(const s of stars){s.y+=s.sp*scrollMul*dt;if(s.y>H+4){s.y=-4;s.x=rnd(0,W);}}
  for(let i=0;i<planets.length;i++){const p=planets[i];p.y+=p.sp*scrollMul*dt;if(p.y-p.sz*.7>H)planets[i]=newPlanet(false,i);}
}
function drawBackground(){
  const c=ctx;
  c.fillStyle='#04050c';c.fillRect(0,0,W,H);
  if(nebula){c.globalAlpha=.95;const oy=nebY-1200;for(let y=oy;y<H;y+=1200){c.drawImage(nebula,0,y,W,1200);}c.globalAlpha=1;}
  for(const p of planets){c.drawImage(p.spr,p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}
  const tt=time;
  for(const s of stars){
    const a=s.l===0?.55:.8+.2*Math.sin(tt*s.ts+s.tw);
    c.globalAlpha=a;c.fillStyle=s.l===2?'#d8e6ff':'#ffffff';
    if(s.l===2&&scrollMul>1.4){c.fillRect(s.x,s.y,s.sz,s.sz*(2+scrollMul*2.2));}else c.fillRect(s.x,s.y,s.sz,s.sz);
  }
  c.globalAlpha=1;
}

function drawShip(c,x,y,s,o){
  const tier=o.tier,acc=o.acc,tm=o.time||0;
  c.save();c.translate(x,y);c.scale(s,s);if(o.bank)c.rotate(o.bank*.14);
  const boost=o.boost?1:0;
  const fl=tier===0?(Math.random()<.14?.25:.6+Math.random()*.4):.85+.15*Math.sin(tm*38+Math.random());
  const flen=(9+tier*5)*fl*(1+boost*.7)+boost*8;
  const nozzles=tier>=3?[-5.5,5.5]:[0];
  c.globalCompositeOperation='lighter';
  for(const nx of nozzles){
    const g=c.createLinearGradient(0,17,0,17+flen);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,tier===0?'rgba(255,170,60,.85)':'rgba(255,176,46,.9)');g.addColorStop(1,'rgba(255,80,20,0)');
    c.fillStyle=g;c.beginPath();c.moveTo(nx-3.4,17);c.quadraticCurveTo(nx,17+flen*1.25,nx+3.4,17);c.closePath();c.fill();
  }
  c.drawImage(glow(tier===0?'#ff9a3c':'#ffb02e'),-12,12,24,16+flen*.8);
  c.globalCompositeOperation='source-over';
  c.lineJoin='round';c.lineWidth=1.2;
  // wings
  const wg=c.createLinearGradient(-24,0,24,0);
  if(tier===0){wg.addColorStop(0,'#4a4f5b');wg.addColorStop(.5,'#7b818d');wg.addColorStop(1,'#4a4f5b');}
  else{wg.addColorStop(0,'#46506c');wg.addColorStop(.5,'#8e9bb8');wg.addColorStop(1,'#46506c');}
  c.fillStyle=wg;c.strokeStyle='#0a0d1c';
  if(tier===0){
    poly(c,[[8,2],[21,15],[19,20],[8,14]]);c.fill();c.stroke();
    poly(c,[[-8,2],[-15,10],[-11,13],[-8,12]]);c.fill();c.stroke();
  }else{
    const w=tier>=2?25:21;
    poly(c,[[8,0],[w,17],[w-2,22],[8,15]]);c.fill();c.stroke();
    poly(c,[[-8,0],[-w,17],[-w+2,22],[-8,15]]);c.fill();c.stroke();
    if(tier>=2){c.fillStyle=acc;poly(c,[[w-3,15],[w,17],[w-2,22],[w-4,20]]);c.fill();poly(c,[[-w+3,15],[-w,17],[-w+2,22],[-w+4,20]]);c.fill();}
    if(tier>=3){c.fillStyle='#2b3350';poly(c,[[10,8],[17,-2],[19,6],[12,13]]);c.fill();c.stroke();poly(c,[[-10,8],[-17,-2],[-19,6],[-12,13]]);c.fill();c.stroke();}
  }
  // barrels
  c.fillStyle='#262b3a';
  const n=Math.min(o.shots||1,5);
  for(let i=0;i<n;i++){const off=(i-(n-1)/2)*(n>3?5.2:6.4);c.fillRect(off-1.2,-20+Math.abs(off)*.25,2.4,9);}
  // body
  const bg=c.createLinearGradient(-10,0,10,0);
  if(tier===0){bg.addColorStop(0,'#575d6a');bg.addColorStop(.5,'#9aa1ad');bg.addColorStop(1,'#575d6a');}
  else{bg.addColorStop(0,'#5a6585');bg.addColorStop(.5,'#c1cbe2');bg.addColorStop(1,'#5a6585');}
  c.fillStyle=bg;
  poly(c,[[0,-24],[7,-7],[10,14],[4,19],[-4,19],[-10,14],[-7,-7]]);c.fill();c.stroke();
  if(tier===0){
    c.fillStyle='#7a4f3a';poly(c,[[3,2],[8,6],[7,13],[2,10]]);c.fill();
    c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=1;c.beginPath();c.moveTo(-6,-2);c.lineTo(-3,3);c.lineTo(-6,8);c.moveTo(1,-12);c.lineTo(3,-8);c.stroke();
  }else{
    c.fillStyle=acc;c.fillRect(-1.2,-18,2.4,22);
    c.fillRect(-9,12,4,2);c.fillRect(5,12,4,2);
  }
  // cockpit
  const cg=c.createLinearGradient(0,-12,0,0);cg.addColorStop(0,tier===0?'#5a7088':'#9fe6ff');cg.addColorStop(1,'#16233f');
  c.fillStyle=cg;c.beginPath();c.ellipse(0,-6,3.4,6,0,0,TAU);c.fill();

  c.restore();
}

  const p={x:W/2,y:H-130,tx:W/2,ty:H-130,hp:S.maxHp,maxHp:S.maxHp,stam:S.maxStam,S,inv:0,shield:null,pw:{multi:0,rapid:0,speed:0},cd:.2,flash:0,vx:0,boost:false,exh:false,regenT:0,alive:true,hurtT:0,trailT:0};
  if(S.startShield>0)p.shield={type:'cyan',col:SH.cyan.col,hits:S.startShield,time:0,thorn:false};
  return p;
}

function startLevel(L){
  audioInit();
  level=clamp(L,1,100);
  const w=Math.floor((level-1)/10);if(w!==world||!nebula)setWorld(w);
  const S=stats();player=makePlayer(S);
  bullets=[];ebul=[];enemies=[];meteors=[];picks=[];parts=[];rings=[];floats=[];boss=null;
  const isBoss=level%5===0;
  run={L:level,isBoss,b:level/5,spawned:0,killed:0,budget:isBoss?0:Math.round(9+level*.85),timer:1.6,mTimer:2.5,t:0,coins:0,gems:0,revives:0,adUsed:false,
    hint:level===1?6:0,banner:2.2,done:false,endT:0,warn:isBoss?2.6:0,bannerBoss:0,deadT:0,bonus:0};
  input.boost=false;
  state='play';show(null);sfx(isBoss?'warning':'start');
}

/* ----- spawning ----- */
function makeEnemy(type,x,y,o){
  o=o||{};const d=ET[type],L=level,tier=Math.floor((L-1)/10);
  const elite=!o.noElite&&L>8&&Math.random()<Math.min(.24,(L-8)*.005);
  const hue=(wHue(world)+d.h+360)%360;
  const e={type,x,y,vx:0,spd:d.spd*(1+L*.004)*(o.spd||1),sz:d.sz*(elite?1.25:1)*(o.sc||1),
    hp:20*d.hp*(1+L*.09)*(elite?2.2:1)*(o.hp||1),t:0,flash:0,ph:rnd(0,TAU),bx:x,amp:rnd(50,110),fr:rnd(1.4,2.4),
    hue,col:hsl2hex(hue,75,56),light:hsl2hex(hue,85,76),dark:hsl2hex(hue,55,26),deep:hsl2hex(hue,60,10),tier,elite,coin:d.coin*(elite?3:1),
    cd:rnd(.9,2),rate:Math.max(.9,2.6-L*.014)*(elite?.75:1),stopY:rnd(80,210),mode:0,arrived:false,dash:null};
  e.max=e.hp;return e;
}
function spawnGroup(){
  const L=level,types=Object.keys(ET).filter(k=>ET[k].unlock<=L);
  let tot=0;const ws=types.map(k=>{const w=ET[k].w*(ET[k].unlock>L-6?1.4:1);tot+=w;return w;});
  let r=Math.random()*tot,pick=types[0];
  for(let i=0;i<types.length;i++){r-=ws[i];if(r<=0){pick=types[i];break;}}
  let cnt={drone:rint(1,3+Math.floor(L/20)),zig:rint(2,4),gunner:rint(1,2),diver:rint(1,3),tank:1,splitter:rint(1,2),weaver:1,hunter:1}[pick];
  cnt=Math.min(cnt,run.budget-run.spawned);
  for(let k=0;k<cnt;k++){
    const x=clamp(W*(k+1)/(cnt+1)+rnd(-18,18),24,W-24);
    enemies.push(makeEnemy(pick,x,-30-(pick==='drone'?0:k*26)));run.spawned++;
  }
}
function spawnMeteor(r0,x,y,vx,vy){
  const r=r0||rnd(13,Math.min(44,26+level*.25));
  const sp=rnd(90,170)+level*1.1,dir=rnd(-.35,.35);
  meteors.push({x:x!==undefined?x:rnd(20,W-20),y:y!==undefined?y:-r-10,vx:vx!==undefined?vx:Math.sin(dir)*sp,vy:vy!==undefined?vy:Math.cos(dir)*sp,
    r,hp:r*1.1*(1+level*.06),rot:rnd(0,TAU),vr:rnd(-2,2),spr:rint(0,7),flash:0});
}
function dropPower(x,y,boostChance){
  if(Math.random()>(boostChance||0)+.07)return;
  let tot=0;DROPS.forEach(d=>tot+=d[1]);let r=Math.random()*tot,id='shield_cyan';
  for(const d of DROPS){r-=d[1];if(r<=0){id=d[0];break;}}
  if(id==='heal'&&player.hp>player.maxHp*.95)id='shield_cyan';
  picks.push({kind:'pow',id,x,y,vy:55,t:rnd(0,TAU)});
}
function dropCoins(x,y,val,n){
  for(let i=0;i<n;i++)picks.push({kind:'coin',x:x+rnd(-10,10),y:y+rnd(-10,10),vy:rnd(40,90),vx:rnd(-40,40),val,t:rnd(0,TAU),mag:false});
}

/* ----- fx ----- */
function boom(x,y,sz,col,n){
  n=n||Math.round(sz*.8)+8;
  for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(40,230)*Math.sqrt(sz/18),l=rnd(.35,.9);parts.push({k:0,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,sz:rnd(1.5,4),col});}
  parts.push({k:1,x,y,vx:0,vy:0,life:.32,max:.32,sz:sz*2.6,col:'#ffd89a'});
  for(let i=0;i<3;i++){const l=rnd(.6,1.1);parts.push({k:2,x:x+rnd(-5,5),y:y+rnd(-5,5),vx:rnd(-30,30),vy:rnd(-30,30),life:l,max:l,sz:sz*rnd(.5,.9),col:'#222'});}
  rings.push({x,y,r:sz*.4,max:sz*3,life:.45,maxl:.45,col});
  if(parts.length>520)parts.splice(0,parts.length-520);
}
function sparks(x,y,col,n){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(60,160);parts.push({k:0,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3,max:.3,sz:rnd(1,2.4),col});}}
function floatText(x,y,txt,col){floats.push({x,y,txt,col,life:.9});}
function addShake(v){if(save.set.shake)shake=Math.max(shake,v);}

/* ----- combat helpers ----- */
function ebShoot(x,y,ang,sp,o){
  o=o||{};
  ebul.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:o.r||5,dmg:ebDmg()*(o.dm||1),kind:o.k||'orb',col:o.col||'#ff9a3c',hm:o.hm||0,life:9,ang});
}
const aim=(x,y,tx,ty)=>Math.atan2(ty-y,tx-x);

function hurt(dmg,src){
  const p=player;if(!p.alive||p.inv>0||run.done)return;
  if(p.shield){
    const s=p.shield;
    if(s.type==='gold'){sfx('shieldHit');return;}
    s.hits--;sfx('shieldHit');p.flash=.15;sparks(p.x,p.y-6,s.col,8);vib(15);
    if(s.hits<=0)p.shield=null;
    p.inv=.35;return;
  }
  p.hp-=dmg*(1-p.S.red);p.inv=.8;p.flash=.25;p.hurtT=.25;addShake(9);sfx('hurt');vib(60);
  sparks(p.x,p.y,'#ff6a5a',10);
  if(p.hp<=0){p.hp=0;die();}
}
function die(){
  const p=player;p.alive=false;state='dead';run.deadT=0;
  boom(p.x,p.y,34,'#ffb02e',40);boom(p.x,p.y,20,'#ff6a5a',20);addShake(14);sfx('bigboom');vib([120,60,200]);
}
function giveShield(type){
  const d=SH[type];player.shield={type,col:d.col,hits:d.hits||0,time:d.time||0,thorn:!!d.thorn};
  if(d.heal)player.hp=Math.min(player.maxHp,player.hp+player.maxHp*d.heal);
  sfx('shield');
}
function killEnemy(e){
  boom(e.x,e.y,e.sz*1.3,e.col);sfx('boom');addShake(e.sz>20?4:2);
  run.killed++;
  const val=Math.max(1,Math.round(e.coin*(1+Math.floor(level/10)*.8)));
  dropCoins(e.x,e.y,val,e.elite?3:1+(Math.random()<.4?1:0));
  dropPower(e.x,e.y,e.elite?.25:0);
  if(e.type==='splitter'){for(let i=0;i<2;i++){const c=makeEnemy('drone',e.x+(i?18:-18),e.y,{noElite:true,sc:.75,hp:.7,spd:1.3});c.vx=i?60:-60;c.canShoot=false;enemies.push(c);}}
}
function killMeteor(m,silent){
  boom(m.x,m.y,m.r*1.1,'#ffb066',Math.round(m.r*.7)+6);sfx('rock');addShake(m.r>24?3:1);
  if(m.r>24){for(let i=0;i<2;i++)spawnMeteor(m.r*.55,m.x,m.y,(i?1:-1)*rnd(50,110),rnd(90,170));}
  if(!silent){if(Math.random()<.3)dropCoins(m.x,m.y,1+Math.floor(level/12),1);dropPower(m.x,m.y,0);}
}

/* ----- player update ----- */
function updatePlayer(dt){
  const p=player,S=p.S;
  p.boost=input.boost&&!p.exh&&p.stam>0&&p.alive;
  const spd=S.speed*(p.pw.speed>0?1.35:1)*(p.boost?1.5:1);
  const kx=keys.right-keys.left,ky=keys.down-keys.up;
  if(kx||ky){const l=Math.hypot(kx,ky);p.tx=clamp(p.x+kx/l*90,22,W-22);p.ty=clamp(p.y+ky/l*90,H*.28,H-48);}
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),st=Math.min(d,spd*dt);
  const ox=p.x;
  if(d>.01){p.x+=dx/d*st;p.y+=dy/d*st;}
  p.vx=lerp(p.vx,(p.x-ox)/Math.max(dt,.001),Math.min(1,dt*10));
  // stamina
  if(p.boost){p.stam-=38*dt;p.regenT=.7;if(p.stam<=0){p.stam=0;p.exh=true;}}
  else{p.regenT-=dt;if(p.regenT<=0)p.stam=Math.min(S.maxStam,p.stam+S.regen*dt);if(p.exh&&p.stam>S.maxStam*.25)p.exh=false;}
  if(p.inv>0)p.inv-=dt;if(p.flash>0)p.flash-=dt;if(p.hurtT>0)p.hurtT-=dt;
  for(const k in p.pw)if(p.pw[k]>0)p.pw[k]-=dt;
  if(p.shield&&p.shield.type==='gold'){p.shield.time-=dt;if(p.shield.time<=0)p.shield=null;}
  // fire
  p.cd-=dt;
  if(p.cd<=0){
    p.cd=S.fireDelay*(p.pw.rapid>0?.55:1)/(p.boost?1.25:1);
    const n=Math.min(7,S.shots+(p.pw.multi>0?2:0)),col=laserCol();
    for(let i=0;i<n;i++){const off=i-(n-1)/2,ang=off*.05;bullets.push({x:p.x+off*8.5,y:p.y-18,vx:Math.sin(ang)*640,vy:-Math.cos(ang)*640,dmg:S.dmg,col});}
    sfx('laser');
  }
  // engine trail
  p.trailT-=dt;
  if(p.trailT<=0){p.trailT=.035;parts.push({k:0,x:p.x+rnd(-2,2),y:p.y+19,vx:rnd(-12,12),vy:rnd(80,160)*(p.boost?1.8:1),life:.28,max:.28,sz:rnd(1.2,2.6),col:tierOf()===0?'#ff9a3c':'#ffb02e'});}
}
const laserCol=()=>tierOf()===0?'#ffe39a':accent();

/* ----- enemy update ----- */
function patrol(e,dt){
  const tx=clamp(e.bx+Math.sin(e.t*e.fr*.5+e.ph)*e.amp,26,W-26);
  e.x+=(tx-e.x)*Math.min(1,dt*3);
  const ty=e.stopY+Math.sin(e.t*.9+e.ph)*16;
  e.y+=(ty-e.y)*Math.min(1,dt*2);
}
function updEnemy(e,dt){
  e.t+=dt;if(e.flash>0)e.flash-=dt;
  const sp=ebSpeed(),p=player;
  if(e.type==='diver'){
    if(e.mode===0){
      if(!e.arrived){e.y+=e.spd*1.8*dt;if(e.y>=e.stopY-6)e.arrived=true;}else patrol(e,dt);
      e.cd-=dt;if(e.cd<=0&&e.arrived){e.mode=1;e.t=0;}
    }else if(e.mode===1){
      e.flash=(Math.floor(e.t*14)%2)?.04:0;
      if(e.t>.7){e.mode=2;e.t=0;const a=aim(e.x,e.y,p.x,p.y),v=380+level*2;e.dash=[Math.cos(a)*v,Math.sin(a)*v];sfx('eshot');}
    }else if(e.mode===2){
      e.x+=e.dash[0]*dt;e.y+=e.dash[1]*dt;
      if(e.t>.85||e.y>H-40||e.x<14||e.x>W-14){e.mode=3;e.t=0;}
    }else{
      const tx=clamp(e.bx,30,W-30),dx=tx-e.x,dy=e.stopY-e.y,d=Math.hypot(dx,dy)||1,v=240;
      e.x+=dx/d*Math.min(d,v*dt);e.y+=dy/d*Math.min(d,v*dt);
      if(d<10){e.mode=0;e.arrived=true;e.t=0;e.cd=rnd(1.4,2.8);}
    }
    return;
  }
  if(!e.arrived){e.y+=e.spd*1.8*dt;if(e.y>=e.stopY-6)e.arrived=true;}
  else patrol(e,dt);
  if(e.y<24)return;
  e.cd-=dt;if(e.cd>0)return;
  switch(e.type){
    case 'drone':{
      e.cd=e.rate*1.1;const a=aim(e.x,e.y,p.x,p.y);
      ebShoot(e.x,e.y+e.sz*.8,a,sp*.85,{col:'#ff9a3c'});sfx('eshot');break;}
    case 'zig':
      e.cd=e.rate;ebShoot(e.x,e.y+e.sz,Math.PI/2,sp,{k:'laser',col:'#ff4a6a'});sfx('eshot');break;
    case 'gunner':{
      e.cd=e.rate;const a=aim(e.x,e.y,p.x,p.y),n=1+(e.tier>=2?1:0)+(e.elite?1:0)+(level>25?1:0);
      for(let i=0;i<n;i++)ebShoot(e.x,e.y+e.sz*.6,a+(i-(n-1)/2)*.16,sp*1.05,{k:'laser',col:'#ff4a6a'});sfx('eshot');break;}
    case 'tank':{
      e.cd=e.rate*1.3;const n=3+Math.min(4,Math.floor(level/18))+(e.elite?2:0);
      for(let i=0;i<n;i++)ebShoot(e.x,e.y+e.sz,Math.PI/2+(i-(n-1)/2)*.22,sp*.85);sfx('eshot');break;}
    case 'splitter':
      e.cd=e.rate*1.4;ebShoot(e.x,e.y+e.sz*.7,aim(e.x,e.y,p.x,p.y),sp*.8,{col:'#ffcf5a'});sfx('eshot');break;
    case 'weaver':{
      e.cd=e.rate*1.5;const n=8+Math.min(8,Math.floor(level/10)),off=rnd(0,TAU);
      for(let i=0;i<n;i++)ebShoot(e.x,e.y,off+i*TAU/n,sp*.62,{col:'#ffcf5a'});sfx('eshot');break;}
    case 'hunter':
      e.cd=e.rate*1.6;ebShoot(e.x,e.y+e.sz*.5,aim(e.x,e.y,p.x,p.y),sp*.55,{hm:1,col:'#c76bff',r:7,dm:1.25});sfx('eshot');break;
  }
}

/* ----- boss ----- */
const PATS=['aimed','fan','ring','spiral','sweep','homing','rain'];
const PDUR={aimed:3.2,fan:3.3,ring:3.2,spiral:2.8,sweep:2.4,homing:3.6,rain:3.2};
function spawnBoss(){
  const b=run.b,k=Math.min(2+Math.floor(b/3),7),rot=b%7,pats=[];
  for(let i=0;i<k;i++)pats.push(PATS[(rot+i)%7]);
  const hue=(b*47+10)%360;
  const max=700*(1+(b-1)*.6);
  boss={x:W/2,y:-140,hp:max,max,sz:62+Math.min(b*2.4,46),b,hue,col:hsl2hex(hue,78,60),dark:hsl2hex(hue,60,22),t:0,state:'enter',pats,pi:0,atk:null,rest:1.2,
    flash:0,sw:.55+b*.025,sides:5+b%4,minT:8,dt:0,ex:0,name:bossName(b)};
  run.bannerBoss=2.4;
}
function updBoss(dt){
  const B=boss,p=player;B.t+=dt;if(B.flash>0)B.flash-=dt;
  if(B.state==='enter'){B.y+=(150-B.y)*Math.min(1,dt*1.5);if(B.t>2.0)B.state='fight';return;}
  if(B.state==='dying'){
    B.dt-=dt;B.ex-=dt;
    if(B.ex<=0){B.ex=.09;boom(B.x+rnd(-B.sz,B.sz),B.y+rnd(-B.sz,B.sz)*.8,rnd(14,28),B.col);sfx('boom');}
    addShake(6);
    if(B.dt<=0){
      boom(B.x,B.y,B.sz*1.2,B.col,80);boom(B.x,B.y,B.sz*.7,'#ffffff',40);sfx('bigboom');addShake(16);vib([100,50,100,50,300]);
      const val=6+Math.floor(level/4);
      for(let i=0;i<18;i++){picks.push({kind:'coin',x:B.x+rnd(-40,40),y:B.y+rnd(-30,30),vy:rnd(-60,40),vx:rnd(-90,90),val,t:rnd(0,TAU),mag:true});}
      boss=null;run.done=true;run.endT=2;ebul=[];
    }
    return;
  }
  B.x=W/2+Math.sin(B.t*B.sw)*(W/2-B.sz-14);B.y=150+Math.sin(B.t*.9)*14;
  const frac=B.hp/B.max,m=frac<.5?.72:1,m2=frac<.25&&B.b>=6?.8:1,rate=m*m2,sp=ebSpeed()*(.9+B.b*.01),bs=(x,y,a,s,o)=>{o=o||{};if(!o.col)o.col=B.col;o.dm=(o.dm||1)*1.1;ebShoot(x,y,a,s,o);};
  if(!B.atk){
    B.rest-=dt;
    if(B.rest<=0){const n=B.pats[B.pi++%B.pats.length];B.atk={n,t:0,tick:0,dur:PDUR[n],k:0,ang:rnd(0,TAU)};}
  }else{
    const a=B.atk;a.t+=dt;a.tick-=dt;
    if(a.tick<=0){
      switch(a.n){
        case 'aimed':{a.tick=.85*rate;const n=3+Math.floor(B.b/6),base=aim(B.x,B.y,p.x,p.y);for(let i=0;i<n;i++)bs(B.x,B.y+B.sz*.5,base+(i-(n-1)/2)*.13,sp*1.15);sfx('eshot');break;}
        case 'fan':{a.tick=1.1*rate;const n=5+Math.floor(B.b/3)+(m<1?2:0);for(let i=0;i<n;i++)bs(B.x,B.y+B.sz*.5,Math.PI/2+(i/(n-1)-.5)*1.7,sp*.95);sfx('eshot');break;}
        case 'ring':{a.tick=1.05*rate;const n=10+B.b,off=a.k++*.35;for(let i=0;i<n;i++)bs(B.x,B.y,off+i*TAU/n,sp*.7);sfx('eshot');break;}
        case 'spiral':{a.tick=.075*rate;a.ang+=.42;bs(B.x,B.y,a.ang,sp*.8);if(B.b>8||m<1)bs(B.x,B.y,a.ang+Math.PI,sp*.8);if(Math.floor(a.t*7)%3===0)sfx('eshot');break;}
        case 'sweep':{a.tick=.06*rate;bs(B.x,B.y+B.sz*.4,Math.PI/2+Math.sin(a.t*2.2)*1.0,sp*1.2,{k:'laser',r:4});break;}
        case 'homing':{a.tick=1.3*rate;for(let i=0;i<2;i++)bs(B.x,B.y+B.sz*.4,Math.PI/2+(i?.5:-.5),120,{hm:1,col:'#c76bff',r:7,dm:1.3});sfx('eshot');break;}
        case 'rain':{a.tick=.2*rate;bs(rnd(14,W-14),-10,Math.PI/2,sp*.85,{k:'laser',r:4});break;}
      }
    }
    if(a.t>=a.dur){B.atk=null;B.rest=Math.max(.45,1.5-B.b*.045)*(m<1?.8:1);}
  }
  B.minT-=dt;
  if(B.b>=3&&B.minT<=0&&enemies.length<5){B.minT=10-Math.min(5,B.b*.25);const ty=B.b>=8?'gunner':'drone';[30,W-30].forEach(x=>{const e=makeEnemy(ty,x,-20,{noElite:true});e.canShoot=true;enemies.push(e);});}
  // contact
  if(Math.hypot(p.x-B.x,p.y-B.y)<B.sz*.8+9)hurt(30+level*.4,'boss');
}
function hitBoss(dmg,x,y){
  if(!boss||boss.state!=='fight')return false;
  boss.hp-=dmg;boss.flash=.06;sfx('hit');sparks(x,y,boss.col,3);
  if(boss.hp<=0){boss.hp=0;boss.state='dying';boss.dt=2;boss.ex=0;ebul=[];run.gems=3+Math.floor(run.b/2)+(save.cleared[level]?-2:3);sfx('warning');}
  return true;
}

/* ----- main update ----- */
function updFx(dt){
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.k===0){q.vx*=1-1.5*dt;q.vy*=1-1.5*dt;}else if(q.k===2){q.sz+=10*dt;}
  }
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=dt;if(r.life<=0){rings.splice(i,1);continue;}r.r=lerp(r.max,r.r,Math.max(0,r.life/r.maxl));}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=28*dt;if(f.life<=0)floats.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*26);
}
function update(dt){
  run.t+=dt;
  if(run.hint>0)run.hint-=dt;if(run.banner>0)run.banner-=dt;if(run.bannerBoss>0)run.bannerBoss-=dt;if(run.warn>0)run.warn-=dt;
  updatePlayer(dt);
  const p=player;
  // director
  if(!run.done){
    if(run.isBoss){if(!boss&&run.t>2.6&&run.warn<=0&&!run.bossSpawned){run.bossSpawned=true;spawnBoss();}}
    else{
      run.timer-=dt;
      if(run.spawned<run.budget&&run.timer<=0&&enemies.length<14){spawnGroup();run.timer=Math.max(.7,2.3-level*.013)*rnd(.8,1.2);}
      if(run.spawned>=run.budget&&enemies.length===0){run.done=true;run.endT=1.5;}
    }
    run.mTimer-=dt;
    const mrate=Math.min(1.9,.3+level*.016);
    if(run.mTimer<=0&&(!run.isBoss||boss)&&run.t>3){spawnMeteor();run.mTimer=rnd(.6,1.4)/mrate;}
  }else{p.inv=Math.max(p.inv,1);ebul=[];run.endT-=dt;if(run.endT<=0){finishLevel();return;}}
  // player bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-20||b.x<-20||b.x>W+20){bullets.splice(i,1);continue;}
    let hit=false;
    for(const e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.sz*.85+3){e.hp-=b.dmg;e.flash=.06;sfx('hit');sparks(b.x,b.y,e.col,2);hit=true;break;}}
    if(!hit)for(const m of meteors){if(Math.hypot(b.x-m.x,b.y-m.y)<m.r*.9+3){m.hp-=b.dmg;m.flash=.06;sfx('hit');sparks(b.x,b.y,'#ffcf9a',2);hit=true;break;}}
    if(!hit&&boss&&boss.state==='fight'&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.sz*.9+3){hitBoss(b.dmg,b.x,b.y);hit=true;}
    if(hit)bullets.splice(i,1);
  }
  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];updEnemy(e,dt);
    if(e.hp<=0){killEnemy(e);enemies.splice(i,1);continue;}
    e.x=clamp(e.x,12,W-12);if(e.y>H-30)e.y=H-30;
    if(p.alive&&Math.hypot(p.x-e.x,p.y-e.y)<e.sz*.8+9){
      if(p.shield&&p.shield.thorn){e.hp=0;killEnemy(e);enemies.splice(i,1);hurt(0);continue;}
      hurt(18+level*.5,'ram');e.hp-=60+level*3;if(e.hp<=0){killEnemy(e);enemies.splice(i,1);}
    }
  }
  // meteors
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=m.vr*dt;if(m.flash>0)m.flash-=dt;
    if(m.hp<=0){killMeteor(m);meteors.splice(i,1);continue;}
    if(m.y>H+60||m.x<-70||m.x>W+70){meteors.splice(i,1);continue;}
    if(p.alive&&Math.hypot(p.x-m.x,p.y-m.y)<m.r*.85+9){
      killMeteor(m,true);meteors.splice(i,1);
      if(p.shield&&p.shield.thorn)hurt(0);else hurt(12+level*.5,'rock');
    }
  }
  if(boss)updBoss(dt);
  // enemy bullets
  for(let i=ebul.length-1;i>=0;i--){
    const b=ebul[i];b.life-=dt;
    if(b.hm&&b.life>6.2){const a=Math.atan2(b.vy,b.vx),ta=aim(b.x,b.y,p.x,p.y);let d=ta-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;const na=a+clamp(d,-1.5*dt,1.5*dt),s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s;b.ang=na;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.life<=0||b.y>H+30||b.y<-40||b.x<-30||b.x>W+30){ebul.splice(i,1);continue;}
    if(p.alive&&Math.hypot(p.x-b.x,p.y-b.y)<b.r+8){ebul.splice(i,1);hurt(b.dmg,'bullet');}
  }
  // pickups
  const S=p.S;
  for(let i=picks.length-1;i>=0;i--){
    const k=picks[i];k.t+=dt;
    if(k.kind==='coin'){
      const d=Math.hypot(p.x-k.x,p.y-k.y);
      if(p.alive&&(k.mag||d<S.magnet)){const s=k.mag?520:380,a=aim(k.x,k.y,p.x,p.y);k.x+=Math.cos(a)*s*dt;k.y+=Math.sin(a)*s*dt;}
      else{k.x+=(k.vx||0)*dt;if(k.vx)k.vx*=1-2*dt;k.y+=k.vy*dt;k.vy=lerp(k.vy,70,Math.min(1,dt*2));}
      if(p.alive&&d<22){const v=Math.max(1,Math.round(k.val*S.loot));save.coins+=v;run.coins+=v;sfx('coin');picks.splice(i,1);floatText(k.x,k.y-10,'+'+v,'#ffd27a');continue;}
    }else{
      k.y+=k.vy*dt;k.x+=Math.sin(k.t*2)*18*dt;
      if(p.alive&&Math.hypot(p.x-k.x,p.y-k.y)<26){applyPower(k.id);picks.splice(i,1);continue;}
    }
    if(k.y>H+30)picks.splice(i,1);
  }
}
function applyPower(id){
  const d=PU[id],p=player;sfx('power');boom(p.x,p.y,10,d.col,10);
  if(d.sh){giveShield(d.sh);return;}
  if(id==='multi')p.pw.multi=12;else if(id==='rapid')p.pw.rapid=12;else if(id==='speed')p.pw.speed=12;
  else if(id==='heal')p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.35);
}
function finishLevel(){
  state='complete';
  const bonus=20+level*6;run.bonus=bonus;save.coins+=bonus;
  if(run.isBoss){save.gems+=run.gems;}
  save.unlocked=Math.max(save.unlocked,Math.min(100,level+1));save.cleared[level]=true;persist();sfx('win');
  if(level>=100){renderOver();show('over');}
  else{renderDone();show('done');}
}
function reviveGame(kind){
  const p=player;p.alive=true;p.hp=kind==='ad'?p.maxHp*.5:p.maxHp;p.inv=2.5;
  if(kind==='ad')giveShield('cyan');else giveShield('gold');
  if(kind==='ad')p.shield.hits=2;
  ebul=[];
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(Math.hypot(e.x-p.x,e.y-p.y)<170){e.hp-=e.max*.6;if(e.hp<=0){killEnemy(e);enemies.splice(i,1);}}}
  for(let i=meteors.length-1;i>=0;i--){if(Math.hypot(meteors[i].x-p.x,meteors[i].y-p.y)<170){killMeteor(meteors[i],true);meteors.splice(i,1);}}
  rings.push({x:p.x,y:p.y,r:10,max:200,life:.6,maxl:.6,col:'#52c8ff'});
  run.revives++;if(kind==='ad')run.adUsed=true;
  state='play';show(null);sfx('revive');vib(40);
}

/* ============ rendering ============ */
function drawEnemy(e){
  const c=ctx,s=e.sz,fl=e.flash>0;
  c.save();c.translate(e.x,e.y);
  const mid=fl?'#fff':e.col,lite=fl?'#fff':e.light,dk=fl?'#fff':e.dark,deep=fl?'#fff':e.deep;
  const grad=(x0,y0,x1,y1)=>{const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,lite);g.addColorStop(.5,mid);g.addColorStop(1,dk);return g;};
  const glowAt=(col,x,y,r,a)=>{c.globalCompositeOperation='lighter';c.globalAlpha=a==null?1:a;c.drawImage(glow(col),x-r,y-r,r*2,r*2);c.globalAlpha=1;c.globalCompositeOperation='source-over';};
  const dot=(x,y,r)=>{c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,TAU);c.fill();};
  c.lineJoin='round';c.lineWidth=1.6;c.strokeStyle=deep;
  glowAt(e.col,0,0,s*1.9,.28);
  switch(e.type){
    case 'drone':
      glowAt('#ffb02e',-s*.5,-s*.75,s*.5);glowAt('#ffb02e',s*.5,-s*.75,s*.5);
      c.fillStyle=grad(-s,0,s,0);
      poly(c,[[0,s*.95],[-s*1.1,-s*.45],[-s*.95,-s*.9],[-s*.32,-s*.42],[0,-s*.62],[s*.32,-s*.42],[s*.95,-s*.9],[s*1.1,-s*.45]]);c.fill();c.stroke();
      for(let i=0;i<Math.min(e.tier,4);i++){c.fillStyle=dk;const k=i*.14;poly(c,[[-s,-s*.5],[-s*(1.35+k),-s*(.9+k)],[-s*.7,-s*.62]]);c.fill();poly(c,[[s,-s*.5],[s*(1.35+k),-s*(.9+k)],[s*.7,-s*.62]]);c.fill();}
      c.fillStyle=grad(0,-s*.5,0,s*.8);poly(c,[[0,s*.8],[-s*.3,-s*.2],[0,-s*.55],[s*.3,-s*.2]]);c.fill();c.stroke();
      c.beginPath();c.moveTo(-s*.5,-s*.1);c.lineTo(-s*.85,-s*.55);c.moveTo(s*.5,-s*.1);c.lineTo(s*.85,-s*.55);c.stroke();
      glowAt('#ff3d5a',0,s*.05,s*.42);dot(0,s*.05,s*.09);break;
    case 'zig':
      glowAt('#ffb02e',0,-s*.8,s*.55);
      c.fillStyle=grad(-s,0,s,0);
      for(const d of[-1,1]){c.beginPath();c.moveTo(d*s*.2,-s*.3);c.quadraticCurveTo(d*s*1.7,-s*.5,d*s*1.25,s*.75);c.quadraticCurveTo(d*s*.85,s*.05,d*s*.2,s*.3);c.closePath();c.fill();c.stroke();}
      for(let i=0;i<Math.min(e.tier,3);i++){c.fillStyle=dk;for(const d of[-1,1]){poly(c,[[d*s*1.1,-s*.1],[d*s*(1.6+i*.15),s*.2],[d*s,s*.35]]);c.fill();}}
      c.fillStyle=grad(0,-s,0,s);poly(c,[[0,s*.95],[-s*.32,s*.1],[-s*.22,-s*.7],[0,-s*.85],[s*.22,-s*.7],[s*.32,s*.1]]);c.fill();c.stroke();
      glowAt('#ff3d5a',0,s*.3,s*.36);dot(0,s*.3,s*.08);break;
    case 'gunner':
      c.fillStyle=deep;c.fillRect(-s*.14,s*.45,s*.28,s*.85);glowAt('#ff6a6a',0,s*1.3,s*.3,.8);
      for(const d of[-1,1]){c.fillStyle=grad(0,-s*.5,0,s*.5);rr(c,d*s*1.05-s*.2,-s*.55,s*.4,s,s*.12);c.fill();c.stroke();c.fillStyle=deep;c.fillRect(d*s*1.05-s*.05,s*.4,s*.1,s*.4);}
      c.fillStyle=grad(-s,-s,s,s);c.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU+Math.PI/6;c.lineTo(Math.cos(a)*s,Math.sin(a)*s);}c.closePath();c.fill();c.stroke();
      c.fillStyle=dk;c.beginPath();c.arc(0,0,s*.55,0,TAU);c.fill();c.stroke();
      glowAt('#ff5a5a',0,0,s*.55);dot(0,0,s*.12);break;
    case 'diver':
      if(e.mode>=2)glowAt('#ffb02e',0,-s*.9,s*1.1,.9);
      if(e.mode===1)glowAt('#ff3d3d',0,0,s*(1.2+Math.sin(e.t*30)*.2),.8);
      c.fillStyle=grad(-s,0,s,0);
      poly(c,[[0,s*1.45],[-s*.42,s*.1],[-s*.95,-s*.95],[-s*.2,-s*.5],[0,-s*.7],[s*.2,-s*.5],[s*.95,-s*.95],[s*.42,s*.1]]);c.fill();c.stroke();
      c.fillStyle=dk;poly(c,[[0,s],[-s*.12,-s*.2],[0,-s*.45],[s*.12,-s*.2]]);c.fill();
      glowAt('#ffe36a',0,s*.35,s*.28);break;
    case 'tank':
      for(const d of[-1,1]){c.fillStyle=deep;c.fillRect(d*s*.62-s*.11,s*.3,s*.22,s);glowAt('#ff6a6a',d*s*.62,s*1.3,s*.3,.8);}
      c.save();c.scale(1.3,1);c.fillStyle=grad(-s,-s,s,s);c.beginPath();for(let i=0;i<8;i++){const a=i/8*TAU+Math.PI/8;c.lineTo(Math.cos(a)*s*.9,Math.sin(a)*s*.9);}c.closePath();c.fill();c.stroke();
      c.fillStyle=dk;c.beginPath();for(let i=0;i<8;i++){const a=i/8*TAU+Math.PI/8;c.lineTo(Math.cos(a)*s*.62,Math.sin(a)*s*.62);}c.closePath();c.fill();c.restore();
      c.fillStyle=lite;for(let i=0;i<6;i++){const a=i/6*TAU;c.beginPath();c.arc(Math.cos(a)*s*1.0,Math.sin(a)*s*.62,s*.06,0,TAU);c.fill();}
      glowAt('#ff5a5a',0,0,s*.55);dot(0,0,s*.13);break;
    case 'splitter':
      c.fillStyle=deep;c.fillRect(-s*.5,-s*.14,s,s*.28);
      for(const d of[-1,1]){const x=d*s*.5,g=c.createRadialGradient(x-s*.15,-s*.2,s*.05,x,0,s*.7);g.addColorStop(0,lite);g.addColorStop(.6,mid);g.addColorStop(1,dk);c.fillStyle=g;c.beginPath();c.arc(x,0,s*.65,0,TAU);c.fill();c.stroke();glowAt('#ffe0a0',x,0,s*.4);dot(x,0,s*.1);}
      break;
    case 'weaver':
      c.rotate(e.t*1.4);c.fillStyle=dk;
      for(let i=0;i<6;i++){c.save();c.rotate(i*Math.PI/3);poly(c,[[s*.6,-s*.2],[s*1.4,0],[s*.6,s*.2]]);c.fill();c.stroke();c.restore();}
      c.strokeStyle=deep;c.lineWidth=s*.46;c.beginPath();c.arc(0,0,s*.7,0,TAU);c.stroke();
      c.strokeStyle=mid;c.lineWidth=s*.34;c.beginPath();c.arc(0,0,s*.7,0,TAU);c.stroke();
      c.strokeStyle=lite;c.lineWidth=s*.08;c.beginPath();c.arc(0,0,s*.76,-.4,1.2);c.stroke();
      c.fillStyle=deep;c.beginPath();c.arc(0,0,s*.38,0,TAU);c.fill();
      glowAt('#ffe36a',0,0,s*.5*(1+.15*Math.sin(e.t*6)));break;
    case 'hunter':
      c.fillStyle=grad(-s,0,s,0);
      for(const d of[-1,1]){c.beginPath();c.moveTo(d*s*.3,-s*.8);c.quadraticCurveTo(d*s*1.6,-s*.6,d*s*.9,s*.9);c.quadraticCurveTo(d*s*.95,s*.1,d*s*.35,-s*.2);c.closePath();c.fill();c.stroke();}
      c.fillStyle=grad(0,-s,0,s);c.beginPath();c.ellipse(0,0,s*.45,s*.7,0,0,TAU);c.fill();c.stroke();
      glowAt('#c76bff',0,s*.05,s*.5);dot(0,s*.05,s*.1);
      glowAt('#c76bff',Math.cos(e.t*3)*s*1.1,Math.sin(e.t*3)*s*.5,s*.25);break;
  }
  c.strokeStyle='#ffd24a';
  if(e.elite){c.lineWidth=2;c.globalAlpha=.85;c.beginPath();c.arc(0,0,s*1.4,0,TAU);c.stroke();c.globalAlpha=1;}
  if(e.hp<e.max){const w=s*1.7;c.fillStyle='rgba(0,0,0,.65)';c.fillRect(-w/2,-s-12,w,4);c.fillStyle=e.elite?'#ffd24a':'#ff6a6a';c.fillRect(-w/2,-s-12,w*Math.max(0,e.hp/e.max),4);}
  c.restore();
}
function drawBoss(){
  const B=boss,c=ctx,s=B.sz,fl=B.flash>0;
  c.save();c.translate(B.x,B.y);
  const f=fl?'#ffffff':B.col,dk=fl?'#ffffff':B.dark;
  c.globalCompositeOperation='lighter';c.globalAlpha=.4;c.drawImage(glow(B.col),-s*1.6,-s*1.6,s*3.2,s*3.2);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  c.lineJoin='round';c.strokeStyle='rgba(5,6,16,.95)';c.lineWidth=3;
  // wings / spikes
  c.fillStyle=dk;
  const n=B.sides;
  for(let i=0;i<n;i++){const a=i/n*TAU+Math.PI/2+Math.sin(B.t*.6)*.05;c.save();c.rotate(a);poly(c,[[s*.78,-s*.2],[s*1.4,0],[s*.78,s*.2]]);c.fill();c.stroke();c.restore();}
  // rotating ring
  c.save();c.rotate(B.t*.5*(B.b%2?1:-1));c.strokeStyle=dk;c.lineWidth=s*.12;c.beginPath();c.arc(0,0,s*.92,0,TAU);c.stroke();
  c.fillStyle=f;for(let i=0;i<6;i++){const a=i/6*TAU;c.beginPath();c.arc(Math.cos(a)*s*.92,Math.sin(a)*s*.92,s*.1,0,TAU);c.fill();}c.restore();
  // body
  const g=c.createRadialGradient(-s*.2,-s*.25,s*.1,0,0,s);g.addColorStop(0,fl?'#fff':hsl2hex(B.hue,70,72));g.addColorStop(1,f);
  c.fillStyle=g;c.beginPath();for(let i=0;i<n;i++){const a=i/n*TAU+Math.PI/2;c.lineTo(Math.cos(a)*s*.8,Math.sin(a)*s*.8);}c.closePath();c.fill();c.stroke();
  // turrets
  c.fillStyle=dk;for(const dx of[-.45,.45]){c.fillRect(s*dx-s*.07,s*.2,s*.14,s*.55);}
  // core
  const frac=B.hp/B.max,pulse=.75+.25*Math.sin(B.t*(4+(1-frac)*8));
  c.fillStyle='#10142a';c.beginPath();c.arc(0,0,s*.3,0,TAU);c.fill();
  c.globalCompositeOperation='lighter';c.globalAlpha=pulse;c.drawImage(glow(frac<.5?'#ff5a5a':'#ffe9a0'),-s*.34,-s*.34,s*.68,s*.68);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  c.restore();
}
function drawPickup(k){
  const c=ctx;
  if(k.kind==='coin'){
    const sx=Math.abs(Math.cos(k.t*4))*.8+.2;
    c.save();c.translate(k.x,k.y);c.scale(sx,1);
    c.fillStyle='#ffb02e';c.beginPath();c.arc(0,0,6.5,0,TAU);c.fill();
    c.fillStyle='#ffe08a';c.beginPath();c.arc(-1,-1,4.3,0,TAU);c.fill();c.restore();
    c.globalCompositeOperation='lighter';c.globalAlpha=.45;c.drawImage(glow('#ffb02e'),k.x-12,k.y-12,24,24);c.globalAlpha=1;c.globalCompositeOperation='source-over';
    return;
  }
  const d=PU[k.id],pulse=1+.12*Math.sin(k.t*6);
  c.save();c.translate(k.x,k.y);
  c.globalCompositeOperation='lighter';c.globalAlpha=.7;c.drawImage(glow(d.col),-26*pulse,-26*pulse,52*pulse,52*pulse);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  c.fillStyle='#0b1022';c.beginPath();c.arc(0,0,12,0,TAU);c.fill();
  c.strokeStyle=d.col;c.lineWidth=2.4;c.beginPath();c.arc(0,0,12,0,TAU);c.stroke();
  c.fillStyle=d.col;c.strokeStyle=d.col;c.lineWidth=2;c.lineCap='round';
  if(d.sh){c.beginPath();c.moveTo(0,-7);c.lineTo(6,-4);c.lineTo(5,3);c.lineTo(0,8);c.lineTo(-5,3);c.lineTo(-6,-4);c.closePath();c.stroke();}
  else if(k.id==='multi'){c.fillRect(-6,-6,2.4,12);c.fillRect(-1.2,-8,2.4,14);c.fillRect(3.6,-6,2.4,12);}
  else if(k.id==='rapid'){c.beginPath();c.moveTo(2,-8);c.lineTo(-4,1);c.lineTo(0,1);c.lineTo(-2,8);c.lineTo(5,-2);c.lineTo(1,-2);c.closePath();c.fill();}
  else if(k.id==='speed'){c.beginPath();c.moveTo(-6,-5);c.lineTo(0,0);c.lineTo(-6,5);c.moveTo(0,-5);c.lineTo(6,0);c.lineTo(0,5);c.stroke();}
  else{c.fillRect(-2,-7,4,14);c.fillRect(-7,-2,14,4);}
  c.restore();
}
function drawPlayer(){
  const p=player,c=ctx;
  if(!p.alive)return;
  const blink=p.inv>0&&p.shield===null&&Math.floor(time*20)%2===0&&p.hurtT<=0&&!run.done;
  if(!blink)drawShip(c,p.x,p.y,1.15,{tier:tierOf(),acc:accent(),time,bank:clamp(p.vx/p.S.speed,-1,1),boost:p.boost,shots:p.S.shots});
  if(p.flash>0){c.globalCompositeOperation='lighter';c.globalAlpha=clamp(p.flash*3,0,.7);c.drawImage(glow('#ff6a5a'),p.x-30,p.y-30,60,60);c.globalAlpha=1;c.globalCompositeOperation='source-over';}
  if(p.shield){
    const s=p.shield,pulse=1+.05*Math.sin(time*8),r=30*pulse,a=s.type==='gold'?(s.time<1.5&&Math.floor(time*10)%2?.25:.9):.85;
    c.save();c.translate(p.x,p.y);
    c.globalCompositeOperation='lighter';
    const g=c.createRadialGradient(0,0,r*.55,0,0,r);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,s.col+'66');
    c.fillStyle=g;c.globalAlpha=a;c.beginPath();c.arc(0,0,r,0,TAU);c.fill();
    c.strokeStyle=s.col;c.lineWidth=2;c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();
    if(s.thorn){c.lineWidth=2;for(let i=0;i<8;i++){const an=i/8*TAU+time*2;c.beginPath();c.moveTo(Math.cos(an)*r,Math.sin(an)*r);c.lineTo(Math.cos(an)*(r+7),Math.sin(an)*(r+7));c.stroke();}}
    if(s.hits>0){c.fillStyle=s.col;for(let i=0;i<s.hits;i++){c.beginPath();c.arc((i-(s.hits-1)/2)*8,r+9,2.4,0,TAU);c.fill();}}
    c.globalAlpha=1;c.restore();
  }
}
function drawBullets(){
  const c=ctx;
  c.globalCompositeOperation='lighter';c.lineCap='round';
  for(const b of bullets){
    c.strokeStyle=b.col;c.globalAlpha=.4;c.lineWidth=7;c.beginPath();c.moveTo(b.x,b.y);c.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);c.stroke();
    c.globalAlpha=1;c.lineWidth=3;c.beginPath();c.moveTo(b.x,b.y);c.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);c.stroke();
    c.strokeStyle='#fff';c.lineWidth=1.2;c.beginPath();c.moveTo(b.x,b.y);c.lineTo(b.x-b.vx*.014,b.y-b.vy*.014);c.stroke();
  }
  for(const b of ebul){
    if(b.kind==='laser'){
      const ca=Math.cos(b.ang),sa=Math.sin(b.ang);
      c.strokeStyle=b.col;c.globalAlpha=.45;c.lineWidth=b.r*2.2;c.beginPath();c.moveTo(b.x-ca*9,b.y-sa*9);c.lineTo(b.x+ca*9,b.y+sa*9);c.stroke();
      c.globalAlpha=1;c.strokeStyle='#fff';c.lineWidth=b.r*.6;c.beginPath();c.moveTo(b.x-ca*8,b.y-sa*8);c.lineTo(b.x+ca*8,b.y+sa*8);c.stroke();
    }else{
      c.globalAlpha=1;c.drawImage(glow(b.col),b.x-b.r*2.6,b.y-b.r*2.6,b.r*5.2,b.r*5.2);
      c.fillStyle='#fff';c.beginPath();c.arc(b.x,b.y,b.r*.45,0,TAU);c.fill();
    }
  }
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
}
function drawFx(){
  const c=ctx;
  for(const q of parts){if(q.k===2){c.globalAlpha=clamp(q.life/q.max,0,1)*.35;c.fillStyle='#2a2630';c.beginPath();c.arc(q.x,q.y,q.sz,0,TAU);c.fill();}}
  c.globalCompositeOperation='lighter';
  for(const q of parts){
    const a=clamp(q.life/q.max,0,1);
    if(q.k===0){c.globalAlpha=a;const r=q.sz*3;c.drawImage(glow(q.col),q.x-r,q.y-r,r*2,r*2);}
    else if(q.k===1){c.globalAlpha=a;const r=q.sz*(1.3-a*.5);c.drawImage(glow(q.col),q.x-r,q.y-r,r*2,r*2);}
  }
  for(const r of rings){c.globalAlpha=clamp(r.life/r.maxl,0,1)*.8;c.strokeStyle=r.col;c.lineWidth=2.5;c.beginPath();c.arc(r.x,r.y,r.r,0,TAU);c.stroke();}
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
  c.font='700 13px "Chakra Petch","Tajawal",sans-serif';c.textAlign='center';
  for(const f of floats){c.globalAlpha=clamp(f.life*1.6,0,1);c.fillStyle=f.col;c.fillText(f.txt,f.x,f.y);}
  c.globalAlpha=1;
}
function txt(s,x,y,size,col,al,w){
  ctx.font=`${w||700} ${size}px "Chakra Petch","Tajawal",sans-serif`;ctx.textAlign=al||'left';ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function drawHUD(){
  const c=ctx,p=player;
  // hp
  c.fillStyle='rgba(8,10,24,.7)';rr(c,10,10,128,14,4);c.fill();
  const hf=clamp(p.hp/p.maxHp,0,1);c.fillStyle=hf>.5?'#4ee6a0':hf>.25?'#ffb02e':'#ff5a6e';rr(c,12,12,124*hf,10,3);c.fill();
  c.fillStyle='rgba(8,10,24,.7)';rr(c,10,28,128,9,4);c.fill();
  c.fillStyle=p.exh?'#8a6a3a':'#52c8ff';rr(c,12,29.5,124*clamp(p.stam/p.S.maxStam,0,1),6,3);c.fill();
  txt(String(save.coins),28,56,14,'#ffd27a','left');
  c.fillStyle='#ffb02e';c.beginPath();c.arc(18,51.5,5.5,0,TAU);c.fill();
  // powerup timers

  // level + progress
  txt(t('level')+' '+level,W/2+4,22,15,'#e8edff','center');
  if(!run.isBoss){
    const f=run.budget?clamp((run.spawned-enemies.length)/run.budget,0,1):0;
    c.fillStyle='rgba(8,10,24,.7)';rr(c,W/2-50,29,108,6,3);c.fill();c.fillStyle='#ffb02e';rr(c,W/2-50,29,108*f,6,3);c.fill();
  }
  // boss bar
  if(boss&&boss.state!=='enter'||(boss&&boss.state==='enter')){
    const bw=W-60,f=clamp(boss.hp/boss.max,0,1);
    c.fillStyle='rgba(8,10,24,.75)';rr(c,30,78,bw,12,4);c.fill();
    c.fillStyle=boss.col;rr(c,32,80,(bw-4)*f,8,3);c.fill();
    txt(boss.name,W/2,104,13,'#ffd7dd','center');
  }
  // banners
  if(run.banner>0&&!run.isBoss){
    const a=clamp(run.banner/.7,0,1)*clamp((2.2-run.banner)/.25,0,1);
    ctx.globalAlpha=a;txt(t('level')+' '+level,W/2,H*.32,38,'#ffffff','center');ctx.globalAlpha=1;
  }
  if(run.isBoss&&run.warn>0){
    const a=.5+.5*Math.sin(time*10);
    c.fillStyle=`rgba(255,40,70,${.10+.12*a})`;c.fillRect(0,0,W,H);
    c.globalAlpha=.6+.4*a;txt(t('warning'),W/2,H*.34,42,'#ff5a6e','center');c.globalAlpha=1;
    txt(t('level')+' '+level,W/2,H*.34+30,16,'#ffd7dd','center');
  }else if(boss&&run.bannerBoss>0){
    const a=clamp(run.bannerBoss/.6,0,1);c.globalAlpha=a;txt(boss.name,W/2,H*.36,30,'#ffffff','center');c.globalAlpha=1;
  }
  if(run.hint>0){
    const a=clamp(run.hint/.8,0,1);c.globalAlpha=a*.9;
    txt(t(matchMedia&&matchMedia('(pointer:coarse)').matches?'hint':'hintKeys'),W/2,H*.62,14,'#c9d4ff','center',500);c.globalAlpha=1;
  }
}
function render(){
  const c=ctx;
  c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#04050c';c.fillRect(0,0,cssW,cssH);
  c.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
  c.save();c.beginPath();c.rect(0,0,W,H);c.clip();
  if(shake>0)c.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawBackground();
  const inGame=player&&run&&(state==='play'||state==='paused'||state==='dead'||state==='complete'||state==='revive');
  if(inGame){
    for(const m of meteors){const set=meteorSet(world),sz=m.r*2.4;c.save();c.translate(m.x,m.y);c.rotate(m.rot);c.drawImage(set[m.spr],-sz/2,-sz/2,sz,sz);
      if(m.flash>0){c.globalCompositeOperation='lighter';c.globalAlpha=.6;c.drawImage(glow('#ffffff'),-m.r,-m.r,m.r*2,m.r*2);}c.restore();}
    for(const k of picks)drawPickup(k);
    for(const e of enemies)drawEnemy(e);
    if(boss)drawBoss();
    drawBullets();
    drawPlayer();
    drawFx();
    drawHUD();
  }else{
    drawShip(c,W/2,H-120,1.9,{tier:tierOf(),acc:accent(),time,bank:Math.sin(time*.7)*.3,shots:stats().shots});
  }
  c.restore();
}

/* ============ loop ============ */
let lastTs=0,hudOn=false,lastP=-1;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(ts-lastTs)/1000||0);lastTs=ts;time+=dt;
  updateBackground(dt);
  if(state==='play')update(dt);
  else if(state==='dead'){
    updFx(dt);run.deadT+=dt;
    if(run.deadT>1.3){state='revive';showRevive();}
  }
  else if(state==='complete'||state==='revive')updFx(dt);
  if(state==='play')updFx(dt);
  const on=state==='play';
  if(on!==hudOn){hudOn=on;$('#pauseBtn').hidden=!on;$('#boostBtn').hidden=!on;if(!on)input.boost=false;}
  if(on&&player){const pr=Math.round(player.stam/player.S.maxStam*100);if(pr!==lastP){lastP=pr;$('#boostBtn').style.setProperty('--p',pr+'%');}
    $('#boostBtn').classList.toggle('on',player.boost);}
  render();
}

let drag=null;
function toLogical(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-offX)/scale,(e.clientY-r.top-offY)/scale];}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||drag)return;
  const[x,y]=toLogical(e);drag={id:e.pointerId,px:x,py:y,sx:player.x,sy:player.y};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id||state!=='play')return;
  const[x,y]=toLogical(e);
  player.tx=clamp(drag.sx+(x-drag.px),22,W-22);player.ty=clamp(drag.sy+(y-drag.py),H*.28,H-48);
});
const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
const kmap={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
window.addEventListener('keydown',e=>{
  if(kmap[e.key]){keys[kmap[e.key]]=1;if(state==='play')e.preventDefault();}
  else if(e.key==='Shift'||e.key===' '){if(state==='play'){input.boost=true;e.preventDefault();}}
  else if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(state==='play')pause();else if(state==='paused')resume();}
});
window.addEventListener('keyup',e=>{
  if(kmap[e.key])keys[kmap[e.key]]=0;
  else if(e.key==='Shift'||e.key===' ')input.boost=false;
});
const bb=$('#boostBtn');
bb.addEventListener('pointerdown',e=>{e.preventDefault();input.boost=true;if(player&&!player.exh&&player.stam>0)sfx('boost');try{bb.setPointerCapture(e.pointerId);}catch(_){}});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>bb.addEventListener(n,()=>{input.boost=false;}));
