<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Void Runner</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Tajawal:wght@500;700&display=swap"><style>
/* Layout: full-bleed canvas stage. Menus are centered glass panels over the live starfield. HUD is drawn on the canvas; pause and boost buttons float in the corners. */
:root{
  --bg:#04050c; --ink:#e8edff; --dim:#8f9bc7; --line:#2b3562;
  --panel:rgba(10,14,30,.92); --panel-hi:rgba(28,36,70,.95);
  --accent:#ffb02e; --accent-ink:#1a1204; --info:#52c8ff; --good:#4ee6a0; --bad:#ff5a6e; --gem:#c79bff;
  --display:'Chakra Petch','Tajawal',system-ui,sans-serif;
  --glass:rgba(11,15,38,.66); --glass-b:rgba(130,150,255,.22);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[dir=rtl] *{letter-spacing:0!important}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 38%,rgba(4,5,12,.18),rgba(4,5,12,.8));animation:fade .35s ease both}
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 60%,#14204a 0%,#070a1c 55%,#03040a 100%);overflow:hidden;transition:opacity .9s ease,transform .9s ease;cursor:pointer}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .stars{position:absolute;inset:-50% 0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 80px 120px,#bcd,transparent),radial-gradient(1.5px 1.5px at 150px 60px,#fff,transparent),radial-gradient(1px 1px at 210px 170px,#9bf,transparent),radial-gradient(1px 1px at 40px 200px,#fff,transparent);background-size:240px 240px;animation:sps 5s linear infinite;opacity:.8}
@keyframes sps{to{transform:translateY(240px)}}
#splash .ship{width:84px;height:84px;color:#ffc24d;filter:drop-shadow(0 0 18px rgba(255,170,60,.7));animation:shipIn 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes shipIn{from{transform:translateY(120px) scale(.6);opacity:0}to{transform:none;opacity:1}}
#splash h1{margin:0;font-size:32px;letter-spacing:.26em;padding-left:.26em;font-weight:700;background:linear-gradient(180deg,#fff,#9fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoIn 1.8s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes logoIn{from{opacity:0;letter-spacing:.8em;filter:blur(8px)}to{opacity:1;letter-spacing:.26em;filter:none}}
#splash .tag{font-size:13px;color:#a9b6ec;letter-spacing:.08em;animation:fade 1.2s 1.5s both}
#splash .bar{width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:18px;animation:fade .6s 1.2s both}
#splash .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffb02e,#ffe08a);transform-origin:left;animation:barF 2.2s 1.2s ease-out both}
@keyframes barF{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#splash .tap{font-size:12px;color:#ffd48a;letter-spacing:.2em;text-transform:uppercase;animation:fade .6s 3.4s both,tapP 1.4s 3.4s ease-in-out infinite}
@keyframes tapP{50%{opacity:.35}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,176,46,.5),0 8px 28px rgba(255,150,20,.35)}50%{box-shadow:0 0 0 10px rgba(255,176,46,0),0 8px 34px rgba(255,150,20,.55)}}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 2px rgba(255,176,46,.5),0 0 14px rgba(255,176,46,.3)}50%{box-shadow:0 0 0 3px rgba(255,176,46,.8),0 0 24px rgba(255,176,46,.6)}}
@keyframes shine{0%{transform:translateX(-160%) skewX(-20deg)}60%,100%{transform:translateX(420%) skewX(-20deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035);box-shadow:0 0 0 2px var(--accent),0 0 24px rgba(255,176,46,.4)}100%{transform:scale(1)}}
@keyframes starIn{0%{transform:scale(2.6) rotate(-40deg);opacity:0}60%{transform:scale(.88) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.panel{width:min(100%,460px);max-height:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:flex;flex-direction:column;gap:12px;min-width:0;padding:20px 18px;border-radius:22px;border:1px solid var(--glass-b);background:linear-gradient(180deg,rgba(26,33,72,.84),rgba(10,13,32,.9));box-shadow:0 26px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fade .3s ease both}
.panel::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:0;height:0}
.panel.fixed{height:min(100%,820px);overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding-block:2px}
.panel>*,.menu-actions>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.panel>*:nth-child(1),.menu-actions>*:nth-child(1){animation-delay:.04s}
.panel>*:nth-child(2),.menu-actions>*:nth-child(2){animation-delay:.09s}
.panel>*:nth-child(3),.menu-actions>*:nth-child(3){animation-delay:.14s}
.panel>*:nth-child(4),.menu-actions>*:nth-child(4){animation-delay:.19s}
.panel>*:nth-child(5){animation-delay:.24s}
.panel>*:nth-child(6){animation-delay:.29s}
.panel>*:nth-child(n+7){animation-delay:.34s}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.05em}
.tag{margin:0;text-align:center;color:var(--dim)}
.sub{color:var(--dim);font-size:13px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
svg{display:block;flex:none}
[dir=rtl] .ic-back,[dir=rtl] .ic-play{transform:scaleX(-1)}
/* main menu */
#s-main{justify-content:space-between;gap:12px}
.topbar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:8px;animation:rise .5s both}
.wallet{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);font-weight:700;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb02e 60%,#b8741a);flex:none}
.gem{display:inline-block;width:11px;height:11px;background:linear-gradient(135deg,#ecd8ff,#a56bff);transform:rotate(45deg);flex:none;margin-inline:2px}
.menu-mid{display:flex;flex-direction:column;align-items:center;gap:6px;animation:rise .7s .1s cubic-bezier(.2,.8,.2,1) both}
.logo{font-weight:700;font-size:clamp(34px,11vw,54px);letter-spacing:.16em;line-height:1.05;text-transform:uppercase;text-align:center;background:linear-gradient(180deg,#fff 20%,#ffc24d 75%,#ff8a1f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding-block:4px;filter:drop-shadow(0 4px 22px rgba(255,150,20,.35))}
.menu-actions{width:min(100%,400px);display:flex;flex-direction:column;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;font:700 16px var(--display);letter-spacing:.04em;color:var(--ink);padding:13px 16px;min-height:50px;border-radius:14px;border:1px solid var(--glass-b);background:linear-gradient(180deg,rgba(62,76,146,.55),rgba(30,38,88,.72));cursor:pointer;text-align:center;transition:transform .15s cubic-bezier(.2,.8,.2,1),filter .15s,border-color .15s}
.btn:hover{filter:brightness(1.18);border-color:rgba(170,185,255,.5)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.tab:focus-visible,.lv:focus-visible,.sw:focus-visible,.seg button:focus-visible,.buy:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#ffc84f,#ff981c);color:#2a1604;border-color:rgba(255,255,255,.35);box-shadow:0 8px 24px rgba(255,150,20,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.primary::after{content:"";position:absolute;top:0;left:0;width:34%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-160%) skewX(-20deg);animation:shine 3.6s ease-in-out 1.2s infinite;pointer-events:none}
.btn.xl{min-height:66px;font-size:21px;letter-spacing:.14em;border-radius:20px;text-transform:uppercase}
.menu-actions>.btn.xl{animation:rise .5s .04s cubic-bezier(.2,.8,.2,1) both,pulse 2.4s 1s ease-in-out infinite}
.btn.danger{border-color:rgba(255,90,110,.6);color:#ff8f9f;background:linear-gradient(180deg,rgba(120,30,50,.35),rgba(60,14,30,.5))}
.btn.small{min-height:42px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.icon{min-height:42px;width:42px;padding:0;border-radius:12px}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;filter:grayscale(.4)}
.tile{flex-direction:column;gap:8px;padding:14px 6px;min-height:84px;font-size:13px;letter-spacing:.06em;border-radius:16px}
.tile svg{width:26px;height:26px;color:#ffc24d}
.langchip{min-width:96px}
.ic{display:inline-flex}
/* level select */
.sector{--h:210;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:linear-gradient(180deg,hsla(var(--h),60%,40%,.18),hsla(var(--h),60%,20%,.1));border:1px solid hsla(var(--h),60%,62%,.22)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:hsl(var(--h),75%,80%)}
.sec-h b{letter-spacing:.1em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.lv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;padding:0;border-radius:12px;border:1px solid hsla(var(--h),60%,66%,.3);background:linear-gradient(180deg,hsla(var(--h),55%,46%,.42),hsla(var(--h),55%,22%,.55));color:var(--ink);font:700 16px var(--display);cursor:pointer;transition:transform .15s,filter .15s;font-variant-numeric:tabular-nums}
.lv:hover{filter:brightness(1.25)}
.lv:active{transform:scale(.93)}
.lv .ss{display:flex;gap:2px;height:7px}
.lv .ss i{width:7px;height:7px;background:#3a4478;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.lv .ss i.on{background:#ffb02e}
.lv.boss{border-color:rgba(255,100,120,.75);background:linear-gradient(180deg,rgba(255,90,110,.36),rgba(120,20,40,.55));box-shadow:0 0 14px rgba(255,90,110,.28)}
.lv.boss::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;background:#ff5a6e;transform:rotate(45deg)}
.lv.cur{border-color:#ffb02e;animation:pulse2 2s ease-in-out infinite}
.lv[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.lv svg{width:18px;height:18px;color:var(--dim)}
/* shop */
.prevrow{display:flex;gap:12px;align-items:center;padding:8px;border-radius:16px;border:1px solid var(--glass-b);background:linear-gradient(180deg,#0a0e26,#141d46)}
#prev{width:46%;max-width:210px;height:auto;aspect-ratio:480/280;display:block;border-radius:12px}
.pstats{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.tier{font-weight:700;font-size:15px;letter-spacing:.06em;color:#ffd48a}
.ps{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:#222b52;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ffb02e,#ffd48a);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:rgba(10,13,36,.7);border:1px solid var(--glass-b)}
.tab{flex:1;font:700 14px var(--display);padding:10px;border-radius:10px;border:0;background:transparent;color:var(--dim);cursor:pointer;min-height:42px;transition:background .2s,color .2s}
.tab[aria-selected=true]{background:linear-gradient(180deg,#ffc84f,#ff981c);color:#2a1604}
.card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(40,52,110,.3);border:1px solid rgba(130,150,255,.15)}
.lore{margin:0;text-align:center;font-size:13px;line-height:1.55;color:#c9d4ff;font-style:italic;padding:0 6px}
.cx{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:rgba(40,52,110,.3);border:1px solid rgba(130,150,255,.15)}
.cx canvas{flex:none;width:92px;height:92px;border-radius:12px;background:radial-gradient(circle,rgba(70,90,200,.25),rgba(5,8,24,.4))}
.cx h3{margin:0;font-size:16px}.cx .ep{font-size:12px;color:#ffd48a;margin:2px 0 6px}.cx p{margin:0 0 4px;font-size:12px;line-height:1.5;color:#c9d4ff}.cx p b{color:#fff}
.cx.lock{opacity:.7}
.card.pop{animation:pop .5s ease}
.ci{flex:none;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,176,46,.26),rgba(255,176,46,.06));color:#ffc24d;border:1px solid rgba(255,176,46,.25)}
.ci svg{width:24px;height:24px}
.cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cm b{font-size:16px}
.pips{display:flex;gap:3px;margin-top:3px}
.pip{flex:1;height:5px;border-radius:3px;background:#222b52;max-width:22px}
.gate{margin-top:4px;font-size:11px;color:#8f9bd0}.gate.ok{color:#7fe8b5}
.pip.on{background:linear-gradient(90deg,#ffb02e,#ffd48a)}
.buy{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:88px;min-height:44px;padding:8px 12px;font:700 15px var(--display);border-radius:12px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,#ffc84f,#ff981c);color:#2a1604;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .15s,filter .15s}
.buy:active{transform:scale(.94)}
.buy[disabled]{cursor:not-allowed;background:rgba(60,72,130,.45);color:var(--dim);border-color:var(--glass-b)}
.buy.owned{background:rgba(78,230,160,.16);color:var(--good);border-color:rgba(78,230,160,.4)}
/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid rgba(130,150,255,.13)}
.srow b{font-size:16px}
.sw{position:relative;flex:none;width:56px;height:32px;padding:0;border-radius:999px;border:1px solid var(--glass-b);background:rgba(40,50,104,.65);cursor:pointer;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#cfd8ff;transition:transform .28s cubic-bezier(.2,.8,.2,1),background .25s}
.sw[aria-checked=true]{background:linear-gradient(180deg,#ffc84f,#ff981c)}
.sw[aria-checked=true]::after{transform:translateX(24px);background:#fff}
[dir=rtl] .sw[aria-checked=true]::after{transform:translateX(-24px)}
.seg{display:inline-flex;border:1px solid var(--glass-b);border-radius:12px;overflow:hidden}
.seg button{font:700 14px var(--display);padding:9px 14px;min-height:40px;background:transparent;color:var(--dim);border:0;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#ffc84f,#ff981c);color:#2a1604}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:6px;border-radius:3px;background:rgba(70,84,156,.7);outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#ffb02e;border:2px solid #fff;box-shadow:0 0 12px rgba(255,176,46,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#ffb02e;border:2px solid #fff;box-shadow:0 0 12px rgba(255,176,46,.6);cursor:pointer}
/* results */
.kicker{text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#ffd48a}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:4px 0 8px}
.stars i{display:block;width:46px;height:46px;background:linear-gradient(180deg,#ffe08a,#ff9a1f);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);filter:drop-shadow(0 0 8px rgba(255,176,46,.6));animation:starIn .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.stars i:nth-child(2){width:58px;height:58px}
.stars i.off{background:#2a3166;filter:none}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid rgba(130,150,255,.13);font-variant-numeric:tabular-nums}
.stat b{display:inline-flex;align-items:center;gap:6px}
.big{font-size:clamp(24px,7vw,30px)}
.adbar{height:10px;border-radius:5px;background:#222b52;overflow:hidden}
.adbar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#52c8ff,#9be2ff);transition:width 1s linear}
/* arsenal, chests, daily */
.cbtns{flex:none;display:flex;flex-direction:column;gap:6px}
.buy.ad{background:linear-gradient(180deg,#7ad8ff,#3fa6e6);color:#06223a}
.shead{margin-top:6px;padding:0 4px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ffd48a}
.cship{flex:none;width:58px;height:58px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#1d2760,#0a0e26);border:1px solid var(--glass-b)}
.card.free{background:linear-gradient(90deg,rgba(63,166,230,.18),rgba(40,52,110,.3));border-color:rgba(122,216,255,.3)}
.loadout{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);font:700 13px var(--display);color:var(--ink);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lchip svg{width:18px;height:18px;color:#ffc24d}
.buffs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:0}
.bchip{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#d9c2ff;background:rgba(160,110,255,.16);border:1px solid rgba(190,150,255,.4)}
.btn.chestbtn{min-height:56px;background:linear-gradient(180deg,#c79bff,#8a5cf0);color:#1a0b3a;border-color:rgba(255,255,255,.4);box-shadow:0 8px 26px rgba(150,100,255,.4);animation:pulse 2.2s ease-in-out infinite}
.btn.chestbtn svg{width:24px;height:24px}
.chestpanel{align-items:stretch}
.chestwrap{position:relative;display:flex;align-items:center;justify-content:center;min-height:210px}
.rays{position:absolute;width:300px;height:300px;border-radius:50%;opacity:0;transition:opacity .5s;background:conic-gradient(from 0deg,rgba(255,224,138,.0),rgba(255,224,138,.5),rgba(255,224,138,0) 12%,rgba(255,224,138,.5) 25%,rgba(255,224,138,0) 37%,rgba(255,224,138,.5) 50%,rgba(255,224,138,0) 62%,rgba(255,224,138,.5) 75%,rgba(255,224,138,0) 87%);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 68%);mask-image:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 8s linear infinite;pointer-events:none}
.rays.on{opacity:1}

#s-chest{padding:0;background:radial-gradient(ellipse at 50% 45%,rgba(40,24,80,.55),rgba(4,5,12,.94))}
#chCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

bossLore:[{"e": "Gatekeeper of the Scrapyard", "i": "A guard machine of the old Choir. It still slams shut on anything that moves.", "o": "Its plates rust shut. Beyond the scrapyard, the first lights of the road appear."}, {"e": "The Drill That Counts", "i": "It spins, counting intruders. The number is never zero.", "o": "Its count ends at one: you. The swarm goes quiet."}, {"e": "Lullaby of Steel", "i": "It broadcasts the Choir's hush-signal. Every engine nearby falls asleep. Yours won't.", "o": "The signal breaks mid-pulse. Somewhere, a very old door unlocks."}, {"e": "The Last Heir of Embers", "i": "A crown of fire on a king no one remembers. It guards a throne with no kingdom.", "o": "The crown cools to ash. You carry its last spark forward."}, {"e": "It Swallowed a Star", "i": "A husk that ate a dying sun to stay alive. It is still hungry.", "o": "The stolen light bleeds out and joins your Ember Seed."}, {"e": "Warden of the Drowned Lane", "i": "Its tides are made of plasma. It never lets a ship pass twice.", "o": "The tide recedes. The lane is open, and silent."}, {"e": "The Ship That Never Landed", "i": "Once a Runner ship, like yours. Now a flicker between two places.", "o": "It looks back at you, just once, then fades. It was thanking you."}, {"e": "Needle of the Old Watch", "i": "A tower that learned to walk. It still believes the war is on.", "o": "The tower folds. Its beacon points toward the Gate."}, {"e": "The Lens That Reads You", "i": "It records every move you make and learns. Do not repeat yourself.", "o": "The lens goes dark. For the first time, nothing is watching."}, {"e": "Orbit of the Sick Moon", "i": "A moon the Choir tried to cure. The cure became the disease.", "o": "The glow settles. A little green returns to the dark."}, {"e": "Chrome Tide, Deep Hunter", "i": "Older than the Gate itself. It crossed a hundred wars to find prey.", "o": "The dreadnought drifts into the dark, and finally rests."}, {"e": "Sovereign of Cinders", "i": "It ruled Solenne's last city. When the star dimmed, it burned the rest.", "o": "The throne collapses. Its flames hand you their warmth."}, {"e": "Harvester of Quiet Glass", "i": "Every shard is a Runner it caught. They glitter where they fell.", "o": "The shards fall away, and one of them hums your name."}, {"e": "Anvil of the Storm", "i": "Lightning is forged here, one blow at a time. Count the strikes.", "o": "The anvil cracks. The storm moves on without it."}, {"e": "The Pale Fortress", "i": "So large it has its own weather. It does not hate you; it simply cannot stop.", "o": "The fortress gate opens. Inside lies a map to the Gate."}, {"e": "Loom of the Empty Threads", "i": "It weaves the paths you fly. Every thread is a choice it already made.", "o": "The threads snap. For once the road is yours to choose."}, {"e": "Sun Tyrant", "i": "It bottled a sun and called it power. The light is not warm; it is bright.", "o": "The false sun goes out. Solenne's real light feels closer."}, {"e": "The Lamp Without a Flame", "i": "It lights the way for lost ships, then leads them into the dark.", "o": "The lantern shatters. Starlight comes through the cracks."}, {"e": "Warden of the Hex-Gate", "i": "The Gate's last guard. Every cell holds a Runner's lost wingman.", "o": "The hexes go dark, one by one, together at last."}, {"e": "All the Runners Who Failed", "i": "Every Runner before you, merged into one. It is not an enemy. It is a test.", "o": "The Singularity opens like a flower. You light the Gate; Solenne shines again."}],
splashTag:'Reach the Gate. Relight the star.',tapStart:'Tap to start',codex:'Archive',codexHint:'Every boss you defeat is recorded here with its story.',cxLocked:'Defeat the boss of level {n} to reveal it.',cxIntro:'Before the fight',cxOutro:'After the fall',begin:'Begin',prologueTitle:'The Last Runner',
prologue:['The star Solenne is dying. Its light, the last warmth of the Cradle, is fading.','Long ago a gate was built to relight it: the Meridian Gate.','But the Choir, an ancient defense network, still guards it. Its machines forgot what they protect.','You are Runner Zero. You carry the Ember Seed. Reach the Gate. Light it.'],
tactics:["Its plates slam shut along the red line. Dodge sideways, then hit the core.", "It drills straight down once the line locks. Leave the lane early.", "Its sails sweep wide. Hold the center and snipe the core.", "Flames fall in rows with a gap. Slide into the green lane.", "Its star arms spin. Fire between the spokes.", "It surges in waves. Cross through the troughs, never the crests.", "It blinks. Watch the ring where it will land, and hit it first.", "The tower beams lock on. Keep moving, never in a straight line.", "It learns your habits. Change your path every few seconds.", "Its debris orbit tightens. Break the ring from outside.", "Long armored hull. Circle wide and hit the glowing segments.", "Flame walls close in. Find the gap and stay calm.", "Blades fan out. Slip between them, then punish.", "Lightning comes on a beat. Count the pulses and move between them.", "Slow but huge. Stay below its guns and hit the core.", "Its threads pull you inward. Strafe, do not fight the pull.", "Blazing rings. Use the dark gaps, the light burns.", "Its light flickers and attacks follow the dark. Watch the flicker.", "Its cells fire in sequence. Learn the order and go around.", "Everything you have learned, all at once. End it, Runner."],l1comm:["Runner Zero, can you hear me? This is Solenne Control.", "The star is dying. We have minutes of light left, not years.", "You carry the Ember Seed. It is our last chance to relight her.", "The Choir's machines have woken. Everything between you and the Gate wants you gone.", "Fly forward. Don't stop. Don't look back. The Cradle is counting on you."],ph2c:["Its armor is breaking! Keep the pressure on!", "It's changing pattern. Stay sharp, Runner!", "Good hit! Something inside it is cracking!"],ph3c:["It's going all in! Find the gap and hold it!", "Final stage! Don't flinch, Runner!", "Everything it has is on you now. Move!"],laneOff:"Sensors are overloaded, runner. Safe-lane guides are offline from here. Read the patterns yourself.",ctlName:"SOLENNE CONTROL",tacName:"TACTICAL",contact:"CONTACT",

bossLore:[{"e": "حارس مقبرة الخردة", "i": "آلة حراسة من جوقة قديمة. ما زالت تنطبق على كل ما يتحرك.", "o": "تصدأ صفائحه وتنغلق. وخلف المقبرة تظهر أولى أنوار الطريق."}, {"e": "المثقاب الذي يعدّ", "i": "يدور ويعدّ الدخلاء. والرقم لا يكون صفراً أبداً.", "o": "ينتهي عدّه عند واحد: أنت. ويسكن السرب."}, {"e": "تهويدة من فولاذ", "i": "يبثّ إشارة الصمت للجوقة فتنام كل المحركات حوله، إلا محركك.", "o": "تنقطع الإشارة في منتصفها، وفي مكانٍ ما ينفتح باب عتيق."}, {"e": "وريث الجمر الأخير", "i": "تاج من نار على ملك لا يذكره أحد. يحرس عرشاً بلا مملكة.", "o": "يبرد التاج إلى رماد، وتحمل أنت شرارته الأخيرة معك."}, {"e": "ابتلع نجمة", "i": "قشرة فارغة أكلت شمساً تحتضر لتبقى حية، وما زالت جائعة.", "o": "ينزف الضوء المسروق ويلتحم ببذرة الجمر التي معك."}, {"e": "حارس الممر الغريق", "i": "مدّه من بلازما، ولا يسمح لسفينة بالمرور مرتين.", "o": "ينحسر المدّ، ويصبح الممر مفتوحاً وصامتاً."}, {"e": "السفينة التي لم تهبط", "i": "كانت سفينة عدّاء مثل سفينتك، وهي الآن وميض بين مكانين.", "o": "ينظر إليك مرة واحدة ثم يتلاشى. كان يشكرك."}, {"e": "إبرة الحرس القديم", "i": "برج تعلّم المشي، وما زال يظنّ أن الحرب مستمرة.", "o": "ينطوي البرج، ويشير منارُه نحو البوابة."}, {"e": "العدسة التي تقرؤك", "i": "تسجّل كل حركة وتتعلم منها. لا تكرّر نفسك.", "o": "تنطفئ العدسة. ولأول مرة لا يراقبك أحد."}, {"e": "مدار القمر المريض", "i": "قمر حاولت الجوقة علاجه فصار العلاج هو المرض.", "o": "يهدأ الوهج، ويعود شيء من الخضرة إلى العتمة."}, {"e": "مدّ الكروم، صياد الأعماق", "i": "أقدم من البوابة نفسها، عبر مئة حرب بحثاً عن فريسة.", "o": "ينجرف الدرنوت في الظلمة، ويستريح أخيراً."}, {"e": "سيّد الرماد", "i": "حكم آخر مدن سولين، وحين خفت النجم أحرق ما تبقى.", "o": "ينهار العرش، وتهبك نيرانه دفأها."}, {"e": "حاصد الزجاج الهادئ", "i": "كل شظية فيه عدّاء أسره، تلمع حيث سقط.", "o": "تتساقط الشظايا، وإحداها تهمس باسمك."}, {"e": "سندان العاصفة", "i": "هنا يُطرق البرق ضربةً بعد ضربة. فعُدّ الضربات.", "o": "يتشقق السندان، وتمضي العاصفة بدونه."}, {"e": "الحصن الشاحب", "i": "ضخم حتى صار له طقسه الخاص. لا يكرهك، لكنه لا يستطيع التوقف.     for(let i=0;i<5;i++){
      const x=22+rn()*52,y=22+rn()*52,r=4+rn()*8;

const stage=$('#stage'),cv=$('#c'),ctx=cv.getContext('2d');
let W=400,H=720,scale=1,offX=0,offY=0,dpr=1,cssW=1,cssH=1;
let world=0,stars=[],planets=[],nebula=null,nebY=0,scrollMul=1;
function resize(){
  const r=stage.getBoundingClientRect();cssW=Math.max(1,r.width);cssH=Math.max(1,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  H=clamp(cssH/cssW*W,600,880);scale=Math.min(cssW/W,cssH/H);offX=(cssW-W*scale)/2;offY=(cssH-H*scale)/2;
  initBackground();
  if(player)player.y=clamp(player.y,H*.28,H-48);
}
function initBackground(){
  stars=[];
  [[70,.7,26],[45,1.1,70],[24,1.7,150],[16,1.2,300]].forEach(([n,sz,sp],li)=>{for(let i=0;i<n;i++)stars.push({x:rnd(0,W),y:rnd(0,H),sz:sz*rnd(.6,1.2),sp:sp*rnd(.85,1.15),tw:rnd(0,TAU),ts:rnd(1,3),l:li});});
  setWorld(world);
}
function newPlanet(init,i){
  const spr=planetSprite(world,rint(0,5));
  const sz=spr.width*rnd(.8,1.15);
  return{spr,sz,x:rnd(0,W),y:init?rnd(-sz,H):-sz*.6-rnd(0,200),sp:rnd(7,16)};
}
function setWorld(w){
  world=w;nebula=makeNebula(w);planets=[];
  for(let i=0;i<3;i++)planets.push(newPlanet(true,i));
}
function updateBackground(dt){
  const target=state==='finale'?(fin&&fin.t>1.2?7:1.6):state==='complete'?1.2:state==='play'?(player&&player.boost?2.5:1):.55;
  scrollMul=lerp(scrollMul,target,Math.min(1,dt*3));
  nebY=(nebY+14*scrollMul*dt)%1200;
  for(const s of stars){s.y+=s.sp*scrollMul*dt;if(s.y>H+4){s.y=-4;s.x=rnd(0,W);}}
  for(let i=0;i<planets.length;i++){const p=planets[i];p.y+=p.sp*scrollMul*dt;if(p.y-p.sz*.7>H)planets[i]=newPlanet(false,i);}
}
function drawBackground(){
  const c=ctx;
  c.fillStyle='#04050c';c.fillRect(0,0,W,H);
  if(nebula){c.globalAlpha=.95;const oy=nebY-1200;for(let y=oy;y<H;y+=1200){c.drawImage(nebula,0,y,W,1200);}c.globalAlpha=1;}
  for(const p of planets){c.drawImage(p.spr,p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}
  const tt=time;
  for(const s of stars){
    if(s.l===3){c.globalAlpha=.16;c.fillStyle='#bcd2ff';c.fillRect(s.x,s.y,s.sz,s.sz*(7+scrollMul*3));continue;}
    const a=s.l===0?.55:.8+.2*Math.sin(tt*s.ts+s.tw);
    c.globalAlpha=a;c.fillStyle=s.l===2?'#d8e6ff':'#ffffff';
    if(s.l===2&&scrollMul>1.4){c.fillRect(s.x,s.y,s.sz,s.sz*(2+scrollMul*2.2));}else c.fillRect(s.x,s.y,s.sz,s.sz);
  }
  c.globalAlpha=1;
}

const upReq=(u,n)=>u.gates?u.gates[n-1]:(n-1)*u.step+1;

  if(u.cur==='gem')return Math.round(u.base*Math.pow(u.grow,lv));

function accent(){return pilotDef().col;}
function tierOf(){let n=0;for(const u of UPS)n+=lvOf(u.id);return n>=75?4:n>=45?3:n>=22?2:n>=8?1:0;}
function stats(){
  const L=lvOf,bf=save.buffs||{};
  let speed=210+L('engine')*14,maxStam=100+L('stamina')*12,regen=14+L('stamina')*1.8;
  let hp=10*(3+(L('armor')>=3?1:0)+(L('armor')>=6?1:0)),red=0;
  let dmg=10*(1+.10*L('laser')),delay=.34*Math.pow(.965,L('rate'));
  let hitR=1,cdMul=1;
  let magnet=60+L('magnet')*18,loot=(1+L('loot')*.08)*(save.prem.coins2?2:1);
  switch(save.pilot){
    case 'viper':delay*=.97;break;
    case 'falcon':speed*=1.04;break;
    case 'phantom':loot*=1.05;break;
    case 'titan':hp+=10;speed*=.94;break;
    case 'comet':speed*=1.03;break;
    case 'raven':hitR=.78;break;
    case 'blaze':cdMul=.8;break;
    case 'warden':magnet+=10;break;
    case 'orion':maxStam*=1.4;regen*=1.4;break;
    case 'reaper':dmg*=1.03;break;
    case 'nova':dmg*=1.12;delay*=.92;speed*=1.06;maxStam*=1.15;break;
  }
  if(bf.hp&&bf.hp.left>0)hp+=bf.hp.amt;
  if(bf.dmg&&bf.dmg.left>0)dmg*=1+bf.dmg.amt;
  if(bf.coins&&bf.coins.left>0)loot*=1+bf.coins.amt;
  return{

  };

function drawShip(c,x,y,s,o){
  const pil=o.pilot!==undefined?o.pilot:save.pilot;
  if(pil&&pil!=='default'&&PSTYLE[pil])return drawPilotShip(c,x,y,s,o,pil);
  const tier=o.tier,acc=o.acc,tm=o.time||0;
  c.save();c.translate(x,y);c.scale(s,s);if(o.bank)c.rotate(o.bank*.14);
  const boost=o.boost?1:0;
  const fl=tier===0?(Math.random()<.14?.25:.6+Math.random()*.4):.85+.15*Math.sin(tm*38+Math.random());
  const flen=(9+tier*5)*fl*(1+boost*.7)+boost*8;
  const nozzles=tier>=3?[-5.5,5.5]:[0];
  c.globalCompositeOperation='lighter';
  for(const nx of nozzles){
    const g=c.createLinearGradient(0,17,0,17+flen);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,tier===0?'rgba(255,170,60,.85)':'rgba(255,176,46,.9)');g.addColorStop(1,'rgba(255,80,20,0)');

  c.globalCompositeOperation='source-over';
  c.lineJoin='round';c.lineWidth=1.2;

  if(tier===0){wg.addColorStop(0,'#4a4f5b');wg.addColorStop(.5,'#7b818d');wg.addColorStop(1,'#4a4f5b');}

    if(tier>=2){c.fillStyle=acc;poly(c,[[w-3,15],[w,17],[w-2,22],[w-4,20]]);c.fill();poly(c,[[-w+3,15],[-w,17],[-w+2,22],[-w+4,20]]);c.fill();}
    if(tier>=3){c.fillStyle='#2b3350';poly(c,[[10,8],[17,-2],[19,6],[12,13]]);c.fill();c.stroke();poly(c,[[-10,8],[-17,-2],[-19,6],[-12,13]]);c.fill();c.stroke();}
  }
  // barrels
  c.fillStyle='#262b3a';
  const n=Math.min(o.shots||1,5);
  for(let i=0;i<n;i++){const off=(i-(n-1)/2)*(n>3?5.2:6.4);c.fillRect(off-1.2,-20+Math.abs(off)*.25,2.4,9);}

  if(tier===0){
    c.fillStyle='#7a4f3a';poly(c,[[3,2],[8,6],[7,13],[2,10]]);c.fill();
    c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=1;c.beginPath();c.moveTo(-6,-2);c.lineTo(-3,3);c.lineTo(-6,8);c.moveTo(1,-12);c.lineTo(3,-8);c.stroke();
  }else{

/* ----- player update ----- */
function updatePlayer(dt){
  const p=player,S=p.S;
  p.boost=input.boost&&!p.exh&&p.stam>0&&p.alive;
  const spd=S.speed*(p.pw.speed>0?1.35:1)*(p.boost?1.5:1);
  const kx=keys.right-keys.left,ky=keys.down-keys.up;
  if(kx||ky){const l=Math.hypot(kx,ky);p.tx=clamp(p.x+kx/l*90,22,W-22);p.ty=clamp(p.y+ky/l*90,H*.28,H-48);}
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),st=Math.min(d,spd*dt);
  const ox=p.x;
  if(d>.01){p.x+=dx/d*st;p.y+=dy/d*st;}
  p.vx=lerp(p.vx,(p.x-ox)/Math.max(dt,.001),Math.min(1,dt*10));
  // stamina
  if(p.boost){p.stam-=38*dt;p.regenT=.7;if(p.stam<=0){p.stam=0;p.exh=true;}}
  else{p.regenT-=dt;if(p.regenT<=0)p.stam=Math.min(S.maxStam,p.stam+S.regen*dt);if(p.exh&&p.stam>S.maxStam*.25)p.exh=false;}
  if(p.inv>0)p.inv-=dt;if(p.flash>0)p.flash-=dt;if(p.hurtT>0)p.hurtT-=dt;
  for(const k in p.pw)if(p.pw[k]>0)p.pw[k]-=dt;
  if(p.shield&&p.shield.type==='gold'){p.shield.time-=dt;if(p.shield.time<=0)p.shield=null;}
  // skills
  const sk=p.sk;
  if(sk.cd>0)sk.cd-=dt;
  if(sk.od>0)sk.od-=dt;if(sk.slow>0)sk.slow-=dt;if(sk.aeg>0)sk.aeg-=dt;
  if(sk.beam>0){sk.beam-=dt;beamTick(dt);}
  if(sk.dr>0){sk.dr-=dt;sk.drT-=dt;if(sk.drT<=0){sk.drT=.4;for(const sx of[-1,1])bullets.push({x:p.x+sx*38,y:p.y-4,vx:0,vy:-600,dmg:S.dmg*.6,col:'#7dff9a'});}}
  if(sk.gv){
    const g=sk.gv;g.t-=dt;g.tk-=dt;const R=150;
    for(let i=ebul.length-1;i>=0;i--){const b=ebul[i],dx=g.x-b.x,dy=g.y-b.y,d=Math.hypot(dx,dy);
      if(d<R){const k=420*dt/Math.max(d,1);b.x+=dx*k;b.y+=dy*k;if(d<26){sparks(b.x,b.y,'#b07bff',2);ebul.splice(i,1);}}}
    for(const m of meteors){const dx=g.x-m.x,dy=g.y-m.y,d=Math.hypot(dx,dy);if(d<R){m.x+=dx/Math.max(d,1)*120*dt;m.y+=dy/Math.max(d,1)*120*dt;}}
    if(g.tk<=0){g.tk=.25;
      for(const e of enemies)if(Math.hypot(e.x-g.x,e.y-g.y)<R+e.sz){e.hp-=50*(1+.06*level)*.12;e.flash=.05;}
      for(const m of meteors)if(Math.hypot(m.x-g.x,m.y-g.y)<R)m.hp-=40;
      if(boss&&boss.state==='fight'&&Math.hypot(boss.x-g.x,boss.y-g.y)<R+boss.sz)hitBoss(boss.max*.0018,g.x,g.y);}
    if(g.t<=0)sk.gv=null;
  }
  if(sk.br){const b=sk.br;b.t-=dt;if(b.t<=0&&b.n>0){b.n--;b.t=.09;b.s*=-1;
      bullets.push({x:p.x+b.s*14,y:p.y-4,vx:b.s*(90+b.n*14),vy:-220,dmg:S.dmg*3,col:'#ff8a5a',type:'missile',life:3,splash:52,tgt:null,tt:0});sfx('missile');}
    if(b.n<=0)sk.br=null;}
  // fire
  p.cd-=dt;
  if(p.cd<=0&&sk.beam<=0){
    const od=sk.od>0;
    p.cd=S.fireDelay*(WDELAY[S.weapon]||1)*(p.pw.rapid>0?.55:1)/(p.boost?1.25:1)*(od?.55:1);
    fireWeapon(p,od?1.5:1);
  }
  // engine trail
  p.trailT-=dt;
  if(p.trailT<=0){p.trailT=.035;parts.push({k:0,x:p.x+rnd(-2,2),y:p.y+19,vx:rnd(-12,12),vy:rnd(80,160)*(p.boost?1.8:1),life:.28,max:.28,sz:rnd(1.2,2.6),col:tierOf()===0?'#ff9a3c':'#ffb02e'});}
}

      for(let i=0;i<k;i++){const off=i-(k-1)/2;bullets.push({x:p.x+off*22,y:p.y-20,vx:0,vy:-400,dmg:d*3.2,col:'#d08bff',type:'orb',r:9,pierce:4,hit:[]});}
      sfx('plasma');break;}
    case 'missile':{
      const k=Math.ceil(n/2);
      for(let i=0;i<k;i++){const side=k===1?(p.ms*=-1):(i%2?1:-1)*(1+Math.floor(i/2)*.7);bullets.push({x:p.x+side*12,y:p.y-4,vx:side*80,vy:-200,dmg:d*2,col:'#ff8a5a',type:'missile',life:3,splash:48,tgt:null,tt:0});}
      sfx('missile');break;}
    case 'arc':fireArc(p,d,n);break;
    default:{
      for(let i=0;i<n;i++){const off=i-(n-1)/2,ang=off*.05;bullets.push({x:p.x+off*8.5,y:p.y-18,vx:Math.sin(ang)*640,vy:-Math.cos(ang)*640,dmg:d,col});}

}
function fireArc(p,d,n){
  let first=null,fd=420;
  const scan=arr=>{for(const o of arr){if(o.y>p.y+10||o.y<-20)continue;const dd=Math.hypot(o.x-p.x,(o.y-p.y)*.7);if(dd<fd){fd=dd;first=o;}}};
  scan(enemies);scan(meteors);if(boss&&boss.state==='fight')scan([boss]);
  if(!first){p.cd=.1;return;}
  const chain=[first];let cur=first;
  for(let k=0;k<1+n;k++){
    let best=null,bd=150;
    for(const o of enemies.concat(meteors)){if(chain.includes(o))continue;const dd=Math.hypot(o.x-cur.x,o.y-cur.y);if(dd<bd){bd=dd;best=o;}}
    if(boss&&boss.state==='fight'&&!chain.includes(boss)){const dd=Math.hypot(boss.x-cur.x,boss.y-cur.y)-boss.sz*.6;if(dd<bd){bd=dd;best=boss;}}
    if(!best)break;chain.push(best);cur=best;
  }
  let px=p.x,py=p.y-14;
  chain.forEach((o,i)=>{dmgTarget(o,d*(i===0?1.15:.75));bolts.push({x1:px,y1:py,x2:o.x,y2:o.y,life:.14,max:.14});px=o.x;py=o.y;});
  sfx('arc');
}
function explodeMissile(b){

  if(boss&&boss.state==='fight'&&Math.hypot(boss.x-b.x,boss.y-b.y)<b.splash+boss.sz*.8)hitBoss(b.dmg*.6,b.x,b.y);
}
function beamTick(dt){

  for(const m of meteors)if(m.y<p.y&&Math.abs(m.x-p.x)<m.r+half){m.hp-=pw*dt*1.5;m.flash=.05;}
  if(boss&&boss.state==='fight'&&Math.abs(boss.x-p.x)<boss.sz+half)hitBoss(pw*dt*.7,p.x,boss.y+boss.sz*.7);

  if(Math.random()<.6)parts.push({k:0,x:p.x+rnd(-12,12),y:rnd(0,p.y),vx:rnd(-30,30),vy:rnd(-60,60),life:.3,max:.3,sz:rnd(1,2.2),col:'#9ff3ff'});
}

/* ----- enemy update ----- */
function patrol(e,dt){
  const tx=clamp(e.bx+Math.sin(e.t*e.fr*.5+e.ph)*e.amp,26,W-26);
  e.x+=(tx-e.x)*Math.min(1,dt*3);
  const ty=e.stopY+Math.sin(e.t*.9+e.ph)*16;
  e.y+=(ty-e.y)*Math.min(1,dt*2);
}
function updEnemy(e,dt){
  e.t+=dt;if(e.flash>0)e.flash-=dt;
  const sp=ebSpeed(),p=player;
  if(e.type==='diver'){
    if(e.mode===0){
      if(!e.arrived){e.y+=e.spd*1.8*dt;if(e.y>=e.stopY-6)e.arrived=true;}else patrol(e,dt);
      e.cd-=dt;if(e.cd<=0&&e.arrived){e.mode=1;e.t=0;}
    }else if(e.mode===1){
      e.flash=(Math.floor(e.t*14)%2)?.04:0;
      if(e.t>.7){e.mode=2;e.t=0;const a=aim(e.x,e.y,p.x,p.y),v=380+level*2;e.dash=[Math.cos(a)*v,Math.sin(a)*v];sfx('eshot');}
    }else if(e.mode===2){
      e.x+=e.dash[0]*dt;e.y+=e.dash[1]*dt;
      if(e.t>.85||e.y>H-40||e.x<14||e.x>W-14){e.mode=3;e.t=0;}
    }else{
      const tx=clamp(e.bx,30,W-30),dx=tx-e.x,dy=e.stopY-e.y,d=Math.hypot(dx,dy)||1,v=240;
      e.x+=dx/d*Math.min(d,v*dt);e.y+=dy/d*Math.min(d,v*dt);
      if(d<10){e.mode=0;e.arrived=true;e.t=0;e.cd=rnd(1.4,2.8);}
    }
    return;
  }
  if(!e.arrived){e.y+=e.spd*1.8*dt;if(e.y>=e.stopY-6)e.arrived=true;}
  else patrol(e,dt);
  if(e.y<24)return;
  if(e.fireT>0){e.fireT-=dt;if(e.fireT<=0)enemyFire(e);}
}
/* Enemies do not shoot at random: they charge (glowing ring), then a whole volley is released on the beat.
   Between beats there is a quiet window, and each volley has a readable shape with a gap. */
const beatLen=()=>Math.max(.78,1.6-level*.009)*(1+(1-ease())*.6);
const maxShooters=()=>level<4?1:2+Math.floor(level/15);
function updBeat(dt){
  if(run.done)return;
  run.beatT-=dt;
  if(run.beatT>0)return;
  run.beatT=beatLen();run.beatN++;
  let k=0;
  for(const e of enemies){if(e.sel){e.sel=false;e.fireT=.02+k*.07;e.rest=e.every;e.lastB=run.beatN;k++;}}
  const cand=enemies.filter(e=>e.type!=='diver'&&e.arrived&&e.y>24&&e.canShoot!==false);
  for(const e of cand)if(e.rest>0)e.rest--;
  const el=cand.filter(e=>e.rest<=0).sort((a,b)=>a.lastB-b.lastB||a.x-b.x);
  for(let i=0;i<Math.min(maxShooters(),el.length);i++)el[i].sel=true;
}
function enemyFire(e){
  const sp=ebSpeed(),p=player;if(!p||!p.alive||run.done)return;
  switch(e.type){
    case 'drone':
      ebShoot(e.x,e.y+e.sz*.8,aim(e.x,e.y,p.x,p.y),sp*.85,{col:'#ff9a3c'});sfx('eshot');break;
    case 'zig':
      ebShoot(e.x,e.y+e.sz,Math.PI/2,sp,{k:'laser',col:'#ff4a6a'});sfx('eshot');break;
    case 'gunner':{
      const a=aim(e.x,e.y,p.x,p.y),n=1+(e.tier>=2?1:0)+(e.elite?1:0)+(level>25?1:0);
      for(let i=0;i<n;i++)ebShoot(e.x,e.y+e.sz*.6,a+(i-(n-1)/2)*.2,sp*1.05,{k:'laser',col:'#ff4a6a'});sfx('eshot');break;}
    case 'tank':{
      const n=3+Math.min(3,Math.floor(level/25))+(e.elite?1:0);
      for(let i=0;i<n;i++)ebShoot(e.x,e.y+e.sz,Math.PI/2+(i-(n-1)/2)*.26,sp*.85);sfx('eshot');break;}
    case 'splitter':
      ebShoot(e.x,e.y+e.sz*.7,aim(e.x,e.y,p.x,p.y),sp*.8,{col:'#ffcf5a'});sfx('eshot');break;
    case 'weaver':{
      const n=Math.min(14,8+Math.floor(level/12)),k=e.k++,gi=(k*3)%n,off=k*.37;
      for(let i=0;i<n;i++){if(((i-gi+n)%n)<3)continue;ebShoot(e.x,e.y,off+i*TAU/n,sp*.62,{col:'#ffcf5a'});}
      lanes.push({k:'ray',x:e.x,y:e.y,ang:off+(gi+1)*TAU/n,sp:sp*.62,life:2.4,max:2.4,t:0});sfx('eshot');break;}
    case 'soldier':{
      const a=aim(e.x,e.y,p.x,p.y);
      for(let i=-1;i<=1;i+=2)ebShoot(e.x+i*6,e.y+e.sz*.7,a+i*.07,sp*.95,{k:'laser',col:'#ff7a4a'});sfx('eshot');break;}
    case 'hunter':
      ebShoot(e.x,e.y+e.sz*.5,aim(e.x,e.y,p.x,p.y),sp*.55,{hm:1,col:'#c76bff',r:7,dm:1.25});sfx('eshot');break;
  }
}
function updLanes(dt){
  for(let i=lanes.length-1;i>=0;i--){const l=lanes[i];l.life-=dt;l.age=(l.age||0)+dt;if(l.k==='strip')l.y+=l.vy*dt;else l.t+=dt;if(l.life<=0)lanes.splice(i,1);}
}

function updBoss(dt){
  const B=boss,p=player;B.t+=dt;if(B.flash>0)B.flash-=dt;

  if(B.state==='enter'){B.y+=(150-B.y)*Math.min(1,dt*1.5);if(B.t>2.0)B.state='fight';return;}
  if(B.state==='dying'){
    B.dt-=dt;B.ex-=dt;
    if(B.ex<=0){B.ex=.09;boom(B.x+rnd(-B.sz,B.sz),B.y+rnd(-B.sz,B.sz)*.8,rnd(14,28),B.col);sfx('boom');}

  }
  const frac=B.hp/B.max,m=frac<.33?.6:frac<.66?.8:1,m2=frac<.25&&B.b>=6?.85:1,rate=m*m2*.85,sp=ebSpeed()*(.9+B.b*.01)*(1+(B.ph-1)*.06),bs=(x,y,a,s,o)=>{o=o||{};if(!o.col)o.col=B.col;o.dm=(o.dm||1)*1.45;ebShoot(x,y,a,s,o);};
  if(B.msgT>0)B.msgT-=dt;

  B.px=B.x;B.py=B.y;

          case 'fan':{a.tick=1.1*rate;const n=Math.min(11,7+Math.floor(B.b/4)+(m<1?1:0)),k2=a.k++,gi=1+((k2*3)%(n-3)),ang=i=>Math.PI/2+(i/(n-1)-.5)*1.7;

/* ----- boss acrobatics: every move is telegraphed and follows a fixed path ----- */
function startMove(){
  const B=boss,list=B.ph===1?['dash','loop']:B.ph===2?['dash','loop','dive','bounce']:['dive','blink','dash','bounce','loop','blink'];
  const n=list[B.mi++%list.length];B.mvDue=Math.max(0,B.mvDue-1);
  const mv=B.mv={n,t:0,s:0,tk:0,x0:B.x,y0:B.y,k:0};
  if(n==='dash'){mv.dir=B.x<W/2?1:-1;mv.sx=mv.dir>0?B.sz+10:W-B.sz-10;mv.y=Math.round(H*(.34+Math.min(.1,B.b*.005)));}
  if(n==='loop'){mv.R=clamp(W/2-B.sz-18,28,88);mv.cx=W/2;mv.cy=215;mv.th=-Math.PI/2;}
  if(n==='dive'){mv.tx=B.x;}
  if(n==='bounce'){mv.dir=B.x<W/2?1:-1;mv.vx=0;mv.vy=0;mv.b=0;}
  if(n==='blink'){mv.dx=clamp(W-B.x,B.sz+14,W-B.sz-14);mv.dy=B.y<190?235:150;}
  sfx('warning');
}
function endMove(){const B=boss;B.mv=null;B.spinV=0;B.state='fight';B.rest=Math.max(.5,.9-B.b*.02);}
function updMove(dt,sp,bs){
  const B=boss,p=player,mv=B.mv;mv.t+=dt;
  const eio=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,lp=(a,b,u)=>a+(b-a)*u;
  switch(mv.n){
    case 'dash':
      if(mv.s===0){const u=Math.min(1,mv.t/.6);B.x=lp(mv.x0,mv.sx,eio(u));B.y=lp(mv.y0,mv.y,eio(u));if(mv.t>=1.15){mv.s=1;mv.t=0;sfx('skill');addShake(5);}}
      else if(mv.s===1){
        B.x+=mv.dir*640*dt;mv.tk-=dt;
        if(mv.tk<=0){mv.tk=.12;bs(B.x,B.y+B.sz*.5,Math.PI/2,105,{r:5});}
        if((mv.dir>0&&B.x>=W-B.sz-10)||(mv.dir<0&&B.x<=B.sz+10)){mv.s=2;mv.t=0;}
      }else if(mv.t>.4)endMove();
      break;
    case 'loop':
      if(mv.s===0){const u=Math.min(1,mv.t/.6),sx=mv.cx,sy=mv.cy-mv.R*.7;B.x=lp(mv.x0,sx,eio(u));B.y=lp(mv.y0,sy,eio(u));if(mv.t>=.9){mv.s=1;mv.t=0;B.spinV=7;}}
      else{
        mv.th+=3.1*dt;B.x=mv.cx+Math.cos(mv.th)*mv.R*1.25;B.y=mv.cy+Math.sin(mv.th)*mv.R*.7;
        mv.tk-=dt;if(mv.tk<=0){mv.tk=.15;bs(B.x,B.y,mv.th,sp*.55);}
        if(mv.th>-Math.PI/2+TAU*2){B.spinV=0;endMove();}
      }
      break;
    case 'dive':
      if(mv.s===0){
        const u=Math.min(1,mv.t/.7);B.y=lp(mv.y0,95,eio(u));B.x=mv.x0+Math.sin(mv.t*60)*1.6;
        if(mv.t<.7)mv.tx=p.x;
        if(mv.t>=1.05){mv.s=1;mv.t=0;mv.sx0=B.x;mv.sy0=B.y;sfx('skill');}
      }else if(mv.s===1){
        const u=Math.min(1,mv.t/.5);B.x=lp(mv.sx0,mv.tx,u*u);B.y=lp(mv.sy0,H-105,u*u);
        if(u>=1){mv.s=2;mv.t=0;addShake(14);sfx('bigboom');rings.push({x:B.x,y:B.y,r:B.sz,max:W*.7,life:.6,maxl:.6,col:B.col});
          const n=12;for(let i=0;i<n;i++){const a=-Math.PI+.5+i*(Math.PI-1)/(n-1);bs(B.x,B.y-B.sz*.3,a,sp*.62);}}
      }else{
        const u=Math.min(1,mv.t/1.1);B.y=lp(H-105,150,eio(u));B.x=lp(mv.tx,W/2,eio(u));if(u>=1)endMove();
      }
      break;
    case 'bounce':
      if(mv.s===0){B.x=mv.x0+Math.sin(mv.t*70)*1.6;if(mv.t>=.7){mv.s=1;mv.vx=mv.dir*400;mv.vy=300;sfx('skill');}}
      else{
        B.x+=mv.vx*dt;B.y+=mv.vy*dt;B.rot+=mv.dir*6*dt;
        const lx=B.sz+10,rx=W-B.sz-10,ty=130,by=Math.round(H*.5);let hit=false;
        if(B.x<lx){B.x=lx;mv.vx=Math.abs(mv.vx);hit=true;}if(B.x>rx){B.x=rx;mv.vx=-Math.abs(mv.vx);hit=true;}
        if(B.y<ty){B.y=ty;mv.vy=Math.abs(mv.vy);hit=true;}if(B.y>by){B.y=by;mv.vy=-Math.abs(mv.vy);hit=true;}
        if(hit){mv.b++;addShake(6);sfx('boom');for(let i=0;i<5;i++)bs(B.x,B.y,Math.PI/2+(i-2)*.38,sp*.7);}
        if(mv.b>=5||mv.t>6.5)endMove();
      }
      break;
    case 'blink':{
      if(mv.s===0){B.x=mv.x0+Math.sin(mv.t*80)*1.8;if(mv.t>=.8){mv.s=1;mv.t=0;B.state='ghost';B.ghostA=0;sfx('shield');}}
      else if(mv.s===1){if(mv.t>=.3){mv.s=2;mv.t=0;B.x=mv.dx;B.y=mv.dy;B.ghostA=1;boom(B.x,B.y,B.sz*.6,B.col,30);sfx('boom');
          const n=Math.min(22,12+Math.floor(B.b*.5)),gi=(B.mi*5)%n;for(let i=0;i<n;i++){if(((i-gi+n)%n)<3)continue;bs(B.x,B.y,i*TAU/n+B.mi*.3,sp*.7);}
          lanes.push({k:'ray',x:B.x,y:B.y,ang:(gi+1)*TAU/n+B.mi*.3,sp:sp*.7,life:3,max:3,t:0});}}
      else if(mv.t>=.35){B.state='fight';endMove();}
      break;}
  }
}
function bossPhase(){
  const B=boss;B.ph++;B.atk=null;B.mv=null;B.spinV=0;B.state='fight';B.mvDue=0;B.rest=1;B.minT=2.5;
  sfx('warning');addShake(12);vib(80);
  B.msg=B.ph>=3?t('enrage'):t('phase',{n:B.ph});B.msgT=1.6;
  {const L=T[save.set.lang]||T.en,a=B.ph>=3?L.ph3c:L.ph2c;comm('ctl',a[(B.b+B.ph)%a.length],.5);}
  boom(B.x,B.y,B.sz*.9,B.col,40);rings.push({x:B.x,y:B.y,r:B.sz,max:W,life:.7,maxl:.7,col:B.col});
  const n=14+B.b,sp=ebSpeed()*.55;
  for(let i=0;i<n;i++)ebShoot(B.x,B.y,i*TAU/n,sp,{col:B.col,dm:1.2});
  const k=B.ph===2?2:3;
  for(let i=0;i<k;i++){const e=mkEsc(W*(i+1)/(k+1),-20,i,i!==1);e.stopY=rnd(190,260);e.amp=40;e.bx=e.x;enemies.push(e);}
  B.pats.push(PATS[(B.pi*3+B.ph*4+B.b)%PATS.length]);
}
function hitBoss(dmg,x,y){
  if(!boss||boss.state!=='fight')return false;
  /* damage is metered: however strong the ship, a boss cannot melt in seconds */
  const a=Math.min(dmg,boss.bk);boss.bk-=a;boss.hp-=a;boss.flash=a<dmg*.6?.02:.06;sfx('hit');sparks(x,y,a<dmg*.6?'#9aa4c8':boss.col,3);
  if(boss.hp<=0){boss.hp=0;boss.state='dying';if(!save.cleared[level])comm('ctl',bossLore(boss.b).o,.6);boss.dt=2;boss.ex=0;ebul=[];run.gems=4+Math.floor(run.b/2)+(save.cleared[level]?-2:4);sfx('warning');}
  return true;
}

/* ----- main update ----- */
function updFx(dt){
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.k===0){q.vx*=1-1.5*dt;q.vy*=1-1.5*dt;}else if(q.k===2){q.sz+=10*dt;}
  }
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=dt;if(r.life<=0){rings.splice(i,1);continue;}r.r=lerp(r.max,r.r,Math.max(0,r.life/r.maxl));}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=28*dt;if(f.life<=0)floats.splice(i,1);}
  for(let i=bolts.length-1;i>=0;i--){bolts[i].life-=dt;if(bolts[i].life<=0)bolts.splice(i,1);}
  if(skFlash>0)skFlash=Math.max(0,skFlash-dt*2.2);
  if(shake>0)shake=Math.max(0,shake-dt*26);
}
function update(dt){
  run.t+=dt;
  if(run.hint>0)run.hint-=dt;if(run.banner>0)run.banner-=dt;if(run.bannerBoss>0)run.bannerBoss-=dt;if(run.warn>0)run.warn-=dt;updComm(dt);
  updatePlayer(dt);
  updTut(dt);
  const p=player,edt=p.sk.slow>0?dt*.4:dt;
  if(run.comboT>0){run.comboT-=dt;if(run.comboT<=0)run.combo=0;}
  // director
  if(!run.done){
    if(run.isBoss){
      if(run.phase==='soldiers'){
        run.timer-=dt;
        if(run.spawned<run.budget&&run.timer<=0&&enemies.length<14){spawnSquad();run.timer=1.8;}
        if(run.spawned>=run.budget&&enemies.length===0){run.phase='warn';run.warn=4.4;run.warnMax=4.4;sfx('warning');
          {const L=T[save.set.lang]||T.en,lo=bossLore(run.b);
           if(!save.cleared[level]){comm('ctl',L.contact+': '+bossName(run.b)+' — '+lo.e,.2);comm('ctl',lo.i);}
           comm('tac',L.tactics[run.b-1]);}}
      }else if(run.phase==='warn'&&run.warn<=0){run.phase='boss';run.bossSpawned=true;spawnBoss();}
    }
    else{
      run.timer-=dt;
      if(run.spawned<run.budget&&run.timer<=0&&enemies.length<16&&!(run.tut&&run.tut.i<1)){spawnGroup();run.timer=Math.max(.5,1.7-level*.01)*rnd(.8,1.2)*(2-ease());}
      if(run.spawned>=run.budget&&enemies.length===0){run.done=true;run.endT=1.5;}
    }
    run.mTimer-=dt;
    const mrate=Math.min(1.9,.3+level*.016)*ease();
    if(run.mTimer<=0&&run.t>(level===1?10:3)&&(!run.isBoss||run.phase!=='warn')){spawnMeteor();run.mTimer=rnd(.6,1.4)/mrate;}
  }else{p.inv=Math.max(p.inv,1);ebul=[];run.endT-=dt;if(run.endT<=0){finishLevel();return;}}
  updBeat(edt);updLanes(edt);
  // player bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.type==='missile'){
      b.tt-=dt;
      if(b.tt<=0){b.tt=.03;parts.push({k:0,x:b.x,y:b.y+6,vx:rnd(-10,10),vy:rnd(20,60),life:.3,max:.3,sz:rnd(1.5,2.6),col:'#ffb066'});}
      let tg=b.tgt;
      if(!tg||tg.hp<=0||(tg===boss&&!boss)){
        tg=null;let bd=1e9;
        for(const o of enemies.concat(meteors)){if(o.y>b.y+20||o.hp<=0)continue;const dd=Math.hypot(o.x-b.x,o.y-b.y);if(dd<bd){bd=dd;tg=o;}}
        if(boss&&boss.state==='fight'){const dd=Math.hypot(boss.x-b.x,boss.y-b.y);if(dd<bd)tg=boss;}
        b.tgt=tg;
      }
      const spd=Math.min(380,Math.hypot(b.vx,b.vy)+520*dt);let ang=Math.atan2(b.vy,b.vx);
      if(tg){const ta=Math.atan2(tg.y-b.y,tg.x-b.x);let df=ta-ang;while(df>Math.PI)df-=TAU;while(df<-Math.PI)df+=TAU;ang+=clamp(df,-5*dt,5*dt);}
      b.vx=Math.cos(ang)*spd;b.vy=Math.sin(ang)*spd;b.rot=ang;
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.life!==undefined){b.life-=dt;if(b.life<=0){if(b.type==='missile')explodeMissile(b);bullets.splice(i,1);continue;}}
    if(b.y<-20||b.x<-20||b.x>W+20||b.y>H+40){bullets.splice(i,1);continue;}
    const rad=b.r||3;let hit=null;
    for(const e of enemies){if(b.hit&&b.hit.includes(e))continue;if(Math.hypot(b.x-e.x,b.y-e.y)<e.sz*.85+rad){hit=e;break;}}
    if(!hit)for(const m of meteors){if(b.hit&&b.hit.includes(m))continue;if(Math.hypot(b.x-m.x,b.y-m.y)<m.r*.9+rad){hit=m;break;}}
    if(!hit&&boss&&boss.state==='fight'&&!(b.hit&&b.hit.includes(boss))&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.sz*.9+rad)hit=boss;
    if(hit){
      if(hit===boss)hitBoss(b.dmg,b.x,b.y);
      else{hit.hp-=b.dmg;hit.flash=.06;sfx('hit');sparks(b.x,b.y,hit.col||'#ffcf9a',2);}
      if(b.type==='missile'){explodeMissile(b);bullets.splice(i,1);}
      else if(b.pierce>0){b.pierce--;b.hit.push(hit);}
      else bullets.splice(i,1);
    }
  }
  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];updEnemy(e,edt);
    if(e.hp<=0){killEnemy(e);enemies.splice(i,1);continue;}
    e.x=clamp(e.x,12,W-12);if(e.y>H-30)e.y=H-30;
    if(p.alive&&Math.hypot(p.x-e.x,p.y-e.y)<e.sz*.8+9){
      if(p.shield&&p.shield.thorn){e.hp=0;killEnemy(e);enemies.splice(i,1);hurt(0);continue;}
      hurt(18+level*.25,'ram');e.hp-=60+level*3;if(e.hp<=0){killEnemy(e);enemies.splice(i,1);}
    }
  }

  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];m.x+=m.vx*edt;m.y+=m.vy*edt;m.rot+=m.vr*edt;if(m.flash>0)m.flash-=dt;
    if(m.hp<=0){killMeteor(m);meteors.splice(i,1);continue;}
    if(m.y>H+60||m.x<-70||m.x>W+70){meteors.splice(i,1);continue;}
    if(lanes.length&&m.y>-20&&inLane(m.x,m.y,m.r)){boom(m.x,m.y,m.r*.7,'#8a96b8',Math.round(m.r*.4)+4);meteors.splice(i,1);continue;}
    if(p.alive&&Math.hypot(p.x-m.x,p.y-m.y)<m.r*.85+9){
      killMeteor(m,true);meteors.splice(i,1);
      if(p.shield&&p.shield.thorn)hurt(0);else hurt(12+level*.25,'rock');
    }

  if(boss)updBoss(edt);

  for(let i=ebul.length-1;i>=0;i--){
    const b=ebul[i];b.life-=edt;
    if(b.hm&&b.life>6.2){const a=Math.atan2(b.vy,b.vx),ta=aim(b.x,b.y,p.x,p.y);let d=ta-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;const na=a+clamp(d,-1.5*edt,1.5*edt),s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s;b.ang=na;}
    b.x+=b.vx*edt;b.y+=b.vy*edt;
    if(b.life<=0||b.y>H+30||b.y<-40||b.x<-30||b.x>W+30){ebul.splice(i,1);continue;}
    if(p.alive&&Math.hypot(p.x-b.x,p.y-b.y)<b.r+8*p.S.hitR){ebul.splice(i,1);hurt(b.dmg,'bullet');}
  }
  // pickups
  const S=p.S;
  for(let i=picks.length-1;i>=0;i--){
    const k=picks[i];k.t+=dt;
    if(k.kind==='coin'){
      const d=Math.hypot(p.x-k.x,p.y-k.y);
      if(p.alive&&(k.mag||d<S.magnet)){const s=k.mag?520:380,a=aim(k.x,k.y,p.x,p.y);k.x+=Math.cos(a)*s*dt;k.y+=Math.sin(a)*s*dt;}
      else{k.x+=(k.vx||0)*dt;if(k.vx)k.vx*=1-2*dt;k.y+=k.vy*dt;k.vy=lerp(k.vy,70,Math.min(1,dt*2));}
      if(p.alive&&d<22){const v=Math.max(1,Math.round(k.val*S.loot));save.coins+=v;run.coins+=v;sfx('coin');picks.splice(i,1);floatText(k.x,k.y-10,'+'+v,'#ffd27a');continue;}
    }else{
      k.y+=k.vy*dt;k.x+=Math.sin(k.t*2)*18*dt;
      if(p.alive&&Math.hypot(p.x-k.x,p.y-k.y)<26){applyPower(k.id);picks.splice(i,1);continue;}
    }
    if(k.y>H+30)picks.splice(i,1);
  }
}
function applyPower(id){
  const d=PU[id],p=player;sfx('power');boom(p.x,p.y,10,d.col,10);
  if(d.sh){giveShield(d.sh);return;}
  if(id==='multi')p.pw.multi=12;else if(id==='rapid')p.pw.rapid=12;else if(id==='speed')p.pw.speed=12;
  else if(id==='heal')p.hp=Math.min(p.maxHp,p.hp+10);
}
let fin=null;
function finishLevel(){
  const p=player,hpf=p.hp/p.maxHp;
  const stars=hpf>=.75&&run.revives===0?3:hpf>=.4?2:1;
  run.stars=stars;
  const bonus=Math.round((20+level*6)*(1+(stars-1)*.25));run.bonus=bonus;save.coins+=bonus;
  if(run.isBoss)save.gems+=run.gems;
  const wasCleared=!!save.cleared[level];
  run.chest=(level%10===0||level===1)&&!wasCleared;if(run.chest){save.chests++;if(level===1)save.tutChest++;}
  for(const k of Object.keys(save.buffs||{})){const b=save.buffs[k];if(b&&b.left>0&&run.buffUsed!==false){b.left--;if(b.left<=0)delete save.buffs[k];}}
  save.unlocked=Math.max(save.unlocked,Math.min(100,level+1));save.cleared[level]=true;save.stars[level]=Math.max(save.stars[level]||0,stars);persist();
  enemies=[];meteors=[];ebul=[];bullets=[];p.inv=99;input.boost=false;drag=null;
  fin={t:0,v:0,flash:0,flew:false,shown:false};state='finale';sfx('win');
}
function updFinale(dt){

      if(Math.hypot(p.x-k.x,p.y-k.y)<24){const v=Math.max(1,Math.round(k.val*p.S.loot));save.coins+=v;run.coins+=v;sfx('coin');k.dead=true;}
    }else k.dead=true;

  else{
    if(!f.flew){f.flew=true;sfx('boost');rings.push({x:p.x,y:p.y,r:10,max:150,life:.5,maxl:.5,col:'#ffffff'});addShake(5);}

    for(let i=0;i<2;i++)parts.push({k:0,x:p.x+rnd(-4,4),y:p.y+20,vx:rnd(-20,20),vy:rnd(200,400),life:.3,max:.3,sz:rnd(1.5,3),col:'#ffb02e'});

}
let fwT=0;

let lastTs=0,hudOn=false,lastP=-1,lastSP=-1;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(ts-lastTs)/1000||0);lastTs=ts;time+=dt;
  updateBackground(dt);
  if(state==='play')update(dt);
  else if(state==='dead'){
    updFx(dt);run.deadT+=dt;
    if(run.deadT>1.3){state='revive';showRevive();}
  }
  else if(state==='finale')updFinale(dt);
  else if(state==='complete'){
    updFx(dt);fwT-=dt;
    if(fwT<=0){fwT=rnd(.35,.8);const hh=rint(0,359);boom(rnd(50,W-50),rnd(80,H*.5),rnd(14,24),hsl2hex(hh,85,62),30);}
  }
  else if(state==='revive')updFx(dt);
  if(state==='play')updFx(dt);
  const on=state==='play';
  if(on!==hudOn){
    hudOn=on;$('#pauseBtn').hidden=!on;$('#boostBtn').hidden=!on;if(!on)input.boost=false;
    const has=on&&player&&player.sk&&player.sk.id;$('#skillBtn').hidden=!has;
    if(has){const sd=SKILLS.find(x=>x.id===player.sk.id);$('#skillBtn span').innerHTML=icon(sd.id);$('#skillBtn').style.setProperty('--c',sd.col);lastSP=-1;}
  }
  if(on&&player&&player.sk&&player.sk.id){
    const k=player.sk,sd=SKILLS.find(x=>x.id===k.id),sp=Math.round((1-clamp(k.cd/sd.cd,0,1))*100),sbn=$('#skillBtn');
    if(sp!==lastSP){lastSP=sp;sbn.style.setProperty('--p',sp+'%');}
    sbn.classList.toggle('ready',k.cd<=0);sbn.classList.toggle('act',k.od>0||k.beam>0||k.slow>0||k.dr>0||k.aeg>0);
  }
  if(on&&player){const pr=Math.round(player.stam/player.S.maxStam*100);if(pr!==lastP){lastP=pr;$('#boostBtn').style.setProperty('--p',pr+'%');}
    $('#boostBtn').classList.toggle('on',player.boost);}
  render();
}

function rollChest(){
  if(save.tutChest>0){
    const sp=PILOTS.filter(x=>x.special&&!save.pilots.includes(x.id));
    save.tutChest--;
    if(sp.length)return{type:'pilot',id:sp[Math.floor(Math.random()*sp.length)].id,rar:'legend'};
    return{type:'gems',n:60,rar:'legend'};
  }
  const r=Math.random();
  const unW=WEAPONS.filter(x=>!save.weapons.includes(x.id)),unS=SKILLS.filter(x=>!save.skills.includes(x.id)),unP=PILOTS.filter(x=>!x.special&&!save.pilots.includes(x.id));
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  if(r<.10&&unP.length)return{type:'pilot',id:pick(unP).id,rar:'legend'};
  if(r<.22&&unW.length)return{type:'weapon',id:pick(unW).id,rar:'epic'};
  if(r<.34&&unS.length)return{type:'skill',id:pick(unS).id,rar:'epic'};
  if(r<.50)return{type:'hp',amt:10*(1+Math.floor(Math.random()*2)),left:5,rar:'rare'};
  if(r<.62)return{type:'dmg',amt:.15+Math.floor(Math.random()*3)*.05,left:5,rar:'rare'};

}
function applyReward(rw){
  switch(rw.type){
    case 'gems':save.gems+=rw.n;break;
    case 'coins':save.coins+=rw.n;break;
    case 'weapon':if(!save.weapons.includes(rw.id))save.weapons.push(rw.id);break;
    case 'skill':if(!save.skills.includes(rw.id))save.skills.push(rw.id);break;
    case 'pilot':if(!save.pilots.includes(rw.id))save.pilots.push(rw.id);break;
    case 'hp':save.buffs.hp={amt:rw.amt,left:rw.left};break;
    case 'dmg':save.buffs.dmg={amt:rw.amt,left:rw.left};break;

    const p=Math.min(1,CH.t/.8),y=g.cy-(1-p*p)*(g.cy+180);
    if(CH.t<.8&&Math.random()<.9)chParts(g.cx,y-40*g.cs,['#ffd27a','#fff2c0'],2,30,{g:-30,life:.5,sz:4});
    if(!CH.landed&&CH.t>=.8){
      CH.landed=true;sfx('boom');if(navigator.vibrate&&save.set.vib)try{navigator.vibrate(40)}catch(e){}
      CH.flash=.35;chParts(g.cx,g.cy+46*g.cs,['#ffe9a8','#ffffff','#c79bff'],26,220,{g:60,life:.9,sz:4,rx:90});
      CH.ring=true;
    }
    if(CH.t>1.7){CH.ph=1;CH.t=0;CH.idle=0;$('#ch-sub').textContent=save.tutChest>0?t('chestGift'):t('tapChest');}
  }else if(CH.ph===1){
    CH.idle+=dt;
    if(Math.random()<dt*10)chParts(g.cx,g.cy-10*g.cs,['#ffd27a','#fff2c0','#c79bff'],1,70,{up:true,spread:2.2,g:-10,life:1.1,sz:3.2,rx:110*g.cs});
    if(CH.idle>3.6)chOpen();
  }else if(CH.ph===2){
    const o=CH.t;
    if(o<1.05&&Math.random()<dt*40)chParts(g.cx,g.cy-48*g.cs,CH.col,1,90,{up:true,spread:1.6,g:200,life:.7,sz:3,rx:90*g.cs});
    if(!CH.burst&&o>=1.05){
      CH.burst=true;CH.flash=1;const L=CH.rw.rar==='legend'?2:CH.rw.rar==='epic'?1.5:1;
      chParts(g.cx,g.cy-50*g.cs,[CH.col,'#ffffff','#ffe9a8'],Math.round(46*L),420*L,{up:true,spread:2.8,g:380,life:1.6,sz:5});
      chParts(g.cx,g.cy-50*g.cs,[CH.col,'#ffffff','#ffd27a','#7dd7ff','#ff6fb5'],Math.round(34*L),300,{up:true,spread:2.4,g:300,life:2.4,sz:6,conf:true});
      sfx(CH.rw.rar==='common'?'chest':'win');sfx('bigboom');vib([60,40,90]);
    }
    if(o>=1.2&&CH.rv<0)CH.rv=0;
    if(CH.rv>=0){
      CH.rv+=dt;
      if(CH.rw.type==='pilot'&&CH.rv>1&&!CH.shine){CH.shine=true;chParts(g.hx,g.hy,[CH.col,'#fff'],30,200,{g:0,life:.8,sz:4});}
      if(CH.rw.type==='pilot'&&Math.random()<dt*14&&CH.rv>1)chParts(g.hx+(Math.random()-.5)*150,g.hy+(Math.random()-.5)*150,['#fff',CH.col],1,10,{g:-20,life:.9,sz:3});
      if(CH.rv>1.1&&!CH.rvShown){CH.rvShown=true;showChestReward(g);}
      if(CH.rv>2.1&&!CH.btns){
        CH.btns=true;$('#ch-back').hidden=false;
        if(save.chests>0){const b=$('#ch-open');b.hidden=false;b.textContent=t('chestNext',{n:save.chests});}
      }
    }
  }
}
function showChestReward(g){
  const rw=CH.rw,el=$('#reward'),wrap=$('#rwWrap');
  el.style.setProperty('--rc',CH.col);
  if(rw.type==='pilot'){
    el.className='reward shipname';
    el.innerHTML=`<div class="rar">${t('rar_'+rw.rar)}</div><b>${t('rw_pilot')}</b><b class="big">${t('pl_'+rw.id)}</b>`;
    wrap.style.top=Math.round(g.hy+g.hs*30)+'px';
  }else{
    el.className='reward';el.innerHTML=rewardHTML(rw);wrap.style.top=Math.round(g.hy-70)+'px';
  }
  el.hidden=false;fillIcons();$('#ch-title').style.opacity='0';
}
function drawChestArt(c,open,col,leak){
  const gold=c.createLinearGradient(0,-50,0,0);gold.addColorStop(0,'#ffe9a0');gold.addColorStop(1,'#c9801a');
  c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.ellipse(0,6,76,10,0,0,TAU);c.fill();
  // inner light + beam
  if(open>0||leak>0){
    c.save();c.globalCompositeOperation='lighter';
    if(open>0){const bg=c.createLinearGradient(0,-50,0,-520);bg.addColorStop(0,hexA(col,.75*open));bg.addColorStop(1,hexA(col,0));c.fillStyle=bg;poly(c,[[-54,-48],[54,-48],[190,-520],[-190,-520]]);c.fill();}
    c.fillStyle=hexA('#ffffff',Math.max(open,leak)*.9);c.fillRect(-56,-52,112,5);
    c.restore();
  }
  // body
  const wd=c.createLinearGradient(0,-50,0,0);wd.addColorStop(0,'#b9692c');wd.addColorStop(1,'#5e2d12');
  c.lineJoin='round';c.lineWidth=3;c.strokeStyle='#2a1408';
  c.fillStyle=wd;rr(c,-62,-50,124,50,7);c.fill();c.stroke();
  c.strokeStyle='rgba(30,12,4,.35)';c.lineWidth=1.5;for(const x of[-21,21]){c.beginPath();c.moveTo(x,-48);c.lineTo(x,-2);c.stroke();}
  c.strokeStyle='#2a1408';c.lineWidth=2;c.fillStyle=gold;
  for(const x of[-58,40]){rr(c,x,-50,18,50,3);c.fill();c.stroke();}
  c.fillRect(-62,-50,124,7);c.strokeRect(-62,-50,124,7);
  c.fillRect(-62,-9,124,7);c.strokeRect(-62,-9,124,7);
  // lock
  c.fillStyle=gold;rr(c,-12,-46,24,28,5);c.fill();c.stroke();
  c.save();c.globalCompositeOperation='lighter';c.drawImage(glow(col),-18,-44,36,36);c.restore();
  c.fillStyle=col;c.beginPath();c.arc(0,-33,5,0,TAU);c.fill();c.stroke();
  c.fillStyle='#1a0b05';c.fillRect(-1.6,-31,3.2,9);
  // lid
  c.save();c.translate(0,-50);
  c.translate(0,-open*22);c.rotate(-.08*open);c.scale(1,1-.55*open);
  const lg=c.createLinearGradient(0,-46,0,0);lg.addColorStop(0,'#d98a43');lg.addColorStop(1,'#7a3b17');
  c.beginPath();c.moveTo(-62,0);c.lineTo(-62,-8);c.quadraticCurveTo(-62,-46,0,-46);c.quadraticCurveTo(62,-46,62,-8);c.lineTo(62,0);c.closePath();
  c.fillStyle=lg;c.fill();c.save();c.clip();
  c.fillStyle=gold;c.fillRect(-58,-50,18,52);c.fillRect(40,-50,18,52);
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(-18,-32,26,7,-.2,0,TAU);c.fill();
  c.restore();c.lineWidth=3;c.strokeStyle='#2a1408';c.stroke();
  c.fillStyle=gold;c.lineWidth=2;rr(c,-62,-5,124,6,2);c.fill();c.stroke();
  c.restore();
}
function chDraw(){
  const cv=$('#chCv'),c=cv.getContext('2d'),g=chGeom(),T=CH.time;
  c.setTransform(CH.dpr,0,0,CH.dpr,0,0);c.clearRect(0,0,g.w,g.h);
  const rw=CH.rw,o=CH.ph===2?CH.t:0;
  // ambient glow
  c.save();c.globalCompositeOperation='lighter';
  const gl=CH.ph>=1?(.35+.1*Math.sin(T*3)+(CH.ph===2?Math.min(1,o)*.4:0)):.15;
  c.globalAlpha=gl;c.drawImage(glow(CH.ph===2?CH.col:'#ffd27a'),g.cx-g.w*.8,g.cy-g.w*.8,g.w*1.6,g.w*1.6);c.restore();
  // rays
  if(CH.burst){
    const ra=Math.min(1,(o-1.05)*1.6)*(rw.rar==='common'?.4:.65);
    c.save();c.globalCompositeOperation='lighter';c.translate(g.hx,g.hy);c.rotate(T*.35);
    const n=16,len=Math.max(g.w,g.h);
    for(let i=0;i<n;i++){c.rotate(TAU/n);const gr=c.createLinearGradient(0,0,len,0);gr.addColorStop(0,hexA(CH.col,ra*.55));gr.addColorStop(1,hexA(CH.col,0));c.fillStyle=gr;c.beginPath();c.moveTo(0,0);c.lineTo(len,-len*.05);c.lineTo(len,len*.05);c.closePath();c.fill();}
    c.restore();
  }
  // chest
  let y=g.cy,rot=0,al=1,open=0,leak=0,sc=g.cs;
  if(CH.ph===0){const p=Math.min(1,CH.t/.8);y=g.cy-(1-p*p)*(g.cy+180);if(CH.t>.8){const b=CH.t-.8;y+=-Math.abs(Math.sin(b*8))*Math.exp(-b*5)*34;}rot=(1-p)*.25;}
  else if(CH.ph===1){y=g.cy+Math.sin(T*3)*4;const a=Math.min(1,CH.idle/3.4);rot=Math.sin(T*(14+a*20))*.02*a*3;sc*=1+.015*Math.sin(T*6);leak=a*.55;}
  else{
    const sh=o<1.05?(.03+o*.05):0;rot=Math.sin(T*50)*sh;leak=Math.min(1,o);
    if(o>=1.05){open=chEO(Math.min(1,(o-1.05)/.55));}
    if(CH.rv>=0){const k=Math.min(1,CH.rv/1.4);y=g.cy+k*60;al=1-k*.88;}
  }
  if(CH.ph===0&&CH.ring){CH.ring=false;}
  c.save();c.globalAlpha=al;c.translate(g.cx+(CH.ph===2&&o<1.05?Math.sin(T*70)*o*3:0),y+46*sc);c.rotate(rot);c.scale(sc,sc);
  drawChestArt(c,open,CH.ph===2?CH.col:'#ffd27a',leak);c.restore();
  // landing shock ring
  if(CH.landed&&CH.ph===0&&CH.t>.8){const k=(CH.t-.8)/.8;if(k<1){c.save();c.globalCompositeOperation='lighter';c.strokeStyle=hexA('#ffe9a8',(1-k)*.8);c.lineWidth=5*(1-k)+1;c.beginPath();c.ellipse(g.cx,g.cy+50*g.cs,60+k*190,12+k*34,0,0,TAU);c.stroke();c.restore();}}
  // reveal item (pilot ship)
  if(rw&&CH.rv>=0){
    const p=Math.min(1,CH.rv/1),e=chBack(p);
    const iy=lerp(g.cy-30,g.hy,chEO(p))+(p>=1?Math.sin(T*2.4)*5:0),is=lerp(.25,1,e);
    c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.5+.2*Math.sin(T*4);const R=g.hs*52*is;c.drawImage(glow(CH.col),g.hx-R*1.4,iy-R*1.4,R*2.8,R*2.8);
    if(p>=1){const f=CH.rv-1,fl=Math.max(0,1-f*.7);c.globalAlpha=Math.min(1,fl+.35)*.9;c.strokeStyle='#ffffff';c.lineWidth=2;c.lineCap='round';
      for(let i=0;i<4;i++){const a=i*Math.PI/2+T*.5,L=(i%2?58:90)*(1+.12*Math.sin(T*5+i))*g.hs/3;c.beginPath();c.moveTo(g.hx,iy);c.lineTo(g.hx+Math.cos(a)*L,iy+Math.sin(a)*L);c.stroke();}}
    c.restore();
    if(rw.type==='pilot'){
      const spin=(1-chEO(p))*TAU*2,sx=Math.cos(spin);
      c.save();c.translate(g.hx,iy);c.scale(Math.abs(sx)<.06?.06:sx,1);
      drawShip(c,0,0,g.hs*is,{pilot:rw.id,tier:0,acc:CH.col,time:T,boost:true,bank:0});c.restore();
      // shine sweep
      if(CH.rv>1&&CH.rv<2){const k=(CH.rv-1),sxp=lerp(-g.hs*40,g.hs*40,k);c.save();c.globalCompositeOperation='lighter';c.translate(g.hx+sxp,iy);c.rotate(.5);const sg=c.createLinearGradient(-14,0,14,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.55)');sg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=sg;c.fillRect(-14,-g.hs*34,28,g.hs*68);c.restore();}
    }
  }
  // particles
  c.save();c.globalCompositeOperation='lighter';
  for(const q of CH.parts){
    const k=1-q.life/q.max;
    if(q.conf){c.save();c.globalCompositeOperation='source-over';c.globalAlpha=Math.min(1,k*1.6);c.translate(q.x,q.y);c.rotate(q.rot);c.fillStyle=q.col;c.fillRect(-q.sz,-q.sz*.5,q.sz*2,q.sz);c.restore();}
    else{c.globalAlpha=Math.min(1,k*1.4);const r=q.sz*(1+k)*2.2;c.drawImage(glow(q.col),q.x-r,q.y-r,r*2,r*2);}
  }
  c.restore();
  if(CH.flash>0){c.fillStyle=`rgba(255,250,235,${Math.min(1,CH.flash)*.85})`;c.fillRect(0,0,g.w,g.h);}
}
$('#chCv').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(CH.ph===1){sfx('click');chOpen();}});
window.addEventListener('resize',()=>{if(curScreen==='chest')chResize();});
click('#b-chest',()=>openChestScreen('main'));
click('#d-chest',()=>openChestScreen('done'));
click('#ch-open',()=>{openChestScreen(chestFrom);});
click('#ch-back',()=>{if(chestFrom==='done'&&state==='complete'){renderDone(true);show('done');}else show('main');});
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('#m-load .lchip');if(!b)return;
  shopTab=b.dataset.go;shopFrom='main';show('shop');
});
/* ---- daily reward ---- */
const DAILY=[{c:150},{c:250},{g:2},{c:400},{g:3},{c:600},{g:5},{ch:1}];
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
function dailyState(){
  const d=save.daily,td=todayStr();
  if(d.last===td)return{can:false,idx:d.streak%DAILY.length};
  if(d.last&&dayDiff(d.last,td)===1)return{can:true,idx:d.streak%DAILY.length};
  return{can:true,idx:0,broke:true};
}
function renderDaily(){
  const st=dailyState();
  $('#dl-title').textContent=t('dailyDay',{n:st.idx+1});
  let h='';
  DAILY.forEach((r,i)=>{
    const cls=i<st.idx?'done':i===st.idx?'today':'';
    const v=r.c?`<i class="coin"></i>${r.c}`:r.g?`<i class="gem"></i>${r.g}`:icon('chest');
    h+=`<div class="day ${cls}"><span class="sub">${t('day',{n:i+1})}</span><b>${v}</b></div>`;
  });
  $('#dl-days').innerHTML=h;fillIcons();
}
click('#dl-claim',()=>{
  const st=dailyState();
  if(st.can){
    const r=DAILY[st.idx];
    if(r.c)save.coins+=r.c;if(r.g)save.gems+=r.g;if(r.ch)save.chests++;
    save.daily={last:todayStr(),streak:(st.broke?0:save.daily.streak)+1};
    persist();sfx('chest');
  }
  show('main');
});
function maybeDaily(){
  if(dailyState().can){renderDaily();show('daily');}
}

applyLang();resize();show('main');
(function(){const sp=$('#splash');if(!sp)return;
  if(window.__VR_TEST){sp.remove();maybeDaily();return;}
  let gone=false;const go=()=>{if(gone)return;gone=true;try{audioInit();sfx('click');}catch(e){}sp.classList.add('out');setTimeout(()=>{sp.remove();maybeDaily();},900);};
  sp.addEventListener('click',go);setTimeout(go,5200);})();
requestAnimationFrame(frame);
})();
